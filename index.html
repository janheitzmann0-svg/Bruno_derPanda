<!DOCTYPE html>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#eef1ea; --panel:#ffffff; --ink:#23271f; --muted:#6f7466;
    --line:#d8ddcd; --accent:#3f6b3f; --accent-deep:#2c4d2c; --accent-soft:#e4ecdd;
    --tag-wg:#1f4e5f; --tag-nwg:#5a4636; --hit:#fff0a8;
    --bubble:#ffffff; --bubble-line:#cdd4c0;
    --shadow:0 1px 2px rgba(30,40,20,.06),0 10px 30px rgba(30,40,20,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 80% -10%, #f6f8f1 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px}

  /* ---- header ---- */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 78%,transparent);
    padding:16px 0 12px}
  .titlerow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px}
  .brand .sub{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:1px}
  .ver{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;
    color:var(--accent-deep);border:1px solid var(--accent);border-radius:999px;
    padding:3px 11px;white-space:nowrap;background:var(--panel)}

  /* ---- panda + bubble ---- */
  .stage{display:flex;align-items:flex-end;gap:18px;margin:26px 0 8px}
  .panda{width:120px;height:120px;flex:none;filter:drop-shadow(0 8px 14px rgba(30,40,20,.12));
    transform-origin:50% 90%;animation:sway 5.5s ease-in-out infinite}
  .panda.think{animation:bounce .6s ease}
  @keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
  @keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(0)}}
  .eyelid{transform-origin:center;animation:blink 5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(0)}96%,98%{transform:scaleY(1)}}
  .bubble{position:relative;background:var(--bubble);border:1px solid var(--bubble-line);
    border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);font-size:15.5px;
    color:var(--ink);max-width:560px;min-height:24px;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .bubble:after,.bubble:before{content:"";position:absolute;left:-13px;bottom:18px;
    border:7px solid transparent}
  .bubble:before{border-right-color:var(--bubble-line)}
  .bubble:after{border-right-color:var(--bubble);left:-11px}
  .bubble .lead{color:var(--accent-deep);font-weight:600}
  .bubble .small{color:var(--muted);font-size:13px}
  .speakbtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:inherit;font-size:13px;border:1px solid var(--accent);
    background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;
    padding:5px 13px;cursor:pointer}
  .speakbtn:hover{background:var(--accent);color:#fff}
  .speakbtn.speaking{background:var(--accent);color:#fff}
  .readbtn{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;
    font-family:inherit;font-size:12.5px;border:1px solid var(--line);
    background:var(--panel);color:var(--accent-deep);border-radius:999px;
    padding:4px 12px;cursor:pointer}
  .readbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .readbtn.speaking{background:var(--accent);color:#fff;border-color:var(--accent)}
  .novoice{color:var(--muted);font-size:12px;margin-top:8px;display:none}

  /* ---- search ---- */
  .searchbar{position:relative;margin-top:18px}
  #q{width:100%;font-size:18px;font-family:inherit;color:var(--ink);
    padding:14px 46px 14px 16px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);box-shadow:var(--shadow);outline:none}
  #q:focus{border-color:var(--accent)}
  .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;
    background:none;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px;
    line-height:1;display:none}
  .meta-line{display:flex;gap:14px;align-items:center;margin-top:9px;flex-wrap:wrap;
    font-size:12.5px;color:var(--muted)}
  .count{font-variant-numeric:tabular-nums}
  .relfilter{display:flex;gap:6px;align-items:center}
  .relfilter button{font-family:inherit;font-size:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
  .relfilter button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-deep);
    background:var(--accent-soft)}

  /* ---- results ---- */
  .results{margin-top:10px}
  .entry{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;margin:16px 0;box-shadow:var(--shadow);scroll-margin-top:170px}
  .entry.flash{animation:flash 1.3s ease}
  @keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
  .ehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .nr{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700;
    font-size:15px;color:var(--accent-deep);white-space:nowrap}
  .thema{font-size:18px;font-weight:600;flex:1;min-width:200px}
  .tags{display:flex;gap:6px}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.5px;
    color:#fff;border-radius:5px;padding:2px 7px;font-weight:600}
  .tag.wg{background:var(--tag-wg)} .tag.nwg{background:var(--tag-nwg)}
  .section{font-size:12px;color:var(--muted);margin-bottom:12px;font-style:italic}
  .body{font-size:15.5px;white-space:pre-wrap;word-wrap:break-word}
  .body mark{background:var(--hit);padding:0 1px;border-radius:2px}
  .xref{color:var(--accent-deep);text-decoration:underline;text-decoration-style:dotted;
    cursor:pointer;text-underline-offset:2px}
  .xref:hover{background:var(--accent-soft)}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--muted);line-height:1.7}
  a{color:var(--accent-deep)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titlerow">
      <div class="brand">
        <div>
          <h1>Panda-Suche
            <span class="sub">BEG EM · Technische FAQ · zeigt nur Originaltext</span>
          </h1>
        </div>
      </div>
      <span class="ver" id="ver"></span>
    </div>
  </header>

  <div class="stage">
    <!-- friendly panda (inline SVG, decoration only) -->
    <svg class="panda" id="panda" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- ears -->
      <circle cx="52" cy="48" r="26" fill="#23271f"/>
      <circle cx="148" cy="48" r="26" fill="#23271f"/>
      <circle cx="52" cy="48" r="13" fill="#3a3f33"/>
      <circle cx="148" cy="48" r="13" fill="#3a3f33"/>
      <!-- head -->
      <ellipse cx="100" cy="108" rx="72" ry="66" fill="#ffffff" stroke="#e2e6da" stroke-width="2"/>
      <!-- eye patches -->
      <ellipse cx="74" cy="104" rx="20" ry="25" fill="#23271f" transform="rotate(-12 74 104)"/>
      <ellipse cx="126" cy="104" rx="20" ry="25" fill="#23271f" transform="rotate(12 126 104)"/>
      <!-- eyes -->
      <circle cx="78" cy="104" r="9" fill="#ffffff"/>
      <circle cx="122" cy="104" r="9" fill="#ffffff"/>
      <circle cx="80" cy="106" r="4.5" fill="#23271f"/>
      <circle cx="120" cy="106" r="4.5" fill="#23271f"/>
      <!-- blinking lids -->
      <rect class="eyelid" x="69" y="95" width="18" height="20" rx="9" fill="#23271f"/>
      <rect class="eyelid" x="113" y="95" width="18" height="20" rx="9" fill="#23271f"/>
      <!-- nose + mouth -->
      <ellipse cx="100" cy="128" rx="9" ry="6" fill="#23271f"/>
      <path d="M100 134 v8 M100 142 q-9 7 -17 2 M100 142 q9 7 17 2" stroke="#23271f"
            stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- cheeks -->
      <circle cx="58" cy="132" r="7" fill="#f6cbd0" opacity=".7"/>
      <circle cx="142" cy="132" r="7" fill="#f6cbd0" opacity=".7"/>
    </svg>

    <div class="bubble" id="bubble">
      <span class="lead">Hallo, ich bin Bruno der Panda! 🐼</span><br>
      <span class="small">Einen Moment …</span>
      <div class="novoice" id="novoice">Bruno hat noch keine Stimme –
        es sind noch keine Audiodateien eingebettet. Die Suche funktioniert natürlich trotzdem.</div>
    </div>
  </div>

  <div class="searchbar">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="Frag den Panda … z. B. „hydraulischer Abgleich“, „8.18“, „Wärmepumpe JAZ“">
    <button class="clear" id="clear" title="Löschen">&times;</button>
  </div>
  <div class="meta-line">
    <span class="count" id="count"></span>
    <span class="relfilter" id="relfilter">
      <button data-rel="ALL" aria-pressed="true">Alle</button>
      <button data-rel="WG" aria-pressed="false">WG</button>
      <button data-rel="NWG" aria-pressed="false">NWG</button>
    </span>
  </div>

  <div class="results" id="results"></div>
  <footer id="footer"></footer>
</div>

<script>
const DATA = {"meta": {"title": "Bundesförderung für effiziente Gebäude – Liste der technischen FAQ – BEG EM", "version": "7.0", "version_date": "06/2026", "inkrafttreten": "01.06.2026", "kfw_bestellnummer": "600 000 4864", "source_note": "Maßgeblich sind die Richtlinien des Förderprogramms (BEG). Dieses Informationsblatt ist nur in der zum Zeitpunkt der Antragstellung aktuellen Fassung gültig."}, "sections": {"1": "Allgemeine Grundlagen", "2": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "3": "Bauteile der Gebäudehülle, opake Bauteile", "4": "Bauteile der Gebäudehülle, transparente Bauteile", "5": "Bauteile der Gebäudehülle, Türen und Tore", "6": "Innenbeleuchtung, Nichtwohngebäude", "7": "Anlagentechnik (außer Heizung)", "8": "Anlagen zur Wärmeerzeugung (Heizungstechnik)"}, "entries": [{"nr": "1.01", "thema": "Gemischt genutzte Gebäude", "relevanz": "WG, NWG", "section": "Allgemeine Grundlagen", "beschreibung": "In der BEG werden Wohn- und Nichtwohngebäude gefördert. Bei gemischt genutzten Gebäuden müssen unter bestimmten Voraussetzungen die unterschiedlich genutzten Teile von Gebäuden getrennt behandelt werden. Die Bewertung und Feststellung zur Antragstellung als Wohn- oder als Nichtwohngebäude erfolgt auf Basis der gesetzlichen Grundlage (GEG) sowie der Technischen Mindestanforderungen der BEG.\n\nNach § 106 GEG sind folgende Fälle gemischt genutzter Gebäude zu unterscheiden:\n\n1. Das Gebäude wird überwiegend (zu mehr als 50 % der Gebäudenutzfläche) zu Wohnzwecken genutzt. Es handelt sich nach § 3 GEG grundsätzlich um ein Wohngebäude. Bei einem gemischt genutzten Wohngebäude ist der Nichtwohngebäudeteil gemäß § 106 Absatz 1 GEG dann getrennt zu behandeln, wenn folgende drei Kriterien gleichzeitig erfüllt sind:\n• die Art der Nutzung unterscheidet sich wesentlich von der Wohnnutzung und\n• der Flächenanteil der Nichtwohnnutzung an der Gebäudenutzfläche ist nicht unerheblich (in der Regel mehr als 10 %) und\n• die gebäudetechnische Ausstattung unterscheidet sich wesentlich von der Wohnnutzung (z. B. zusätzliche Lüftungstechnik, Kühlung, etc.).\n\nTypische Fälle wohnähnlicher Nutzungen sind z. B. freiberufliche und freiberufsähnliche gewerbliche Nutzungen, die üblicherweise in Wohnungen stattfinden können.\n\nAlternativ darf der Nichtwohngebäudeteil für die BEG dann getrennt behandelt werden, wenn der Flächenanteil mehr als 10 % beträgt.\n\nSpezifische Einzelmaßnahmen für Nichtwohngebäude sind im Nichtwohngebäudeteil auch unabhängig vom Flächenanteil der Nichtwohnnutzung förderfähig. Hierzu gehören gebäudebezogene Mess-, Steuerungs- und Regelungstechnik, Kühltechnik oder Beleuchtungstechnik im Sinne des GEG (keine Prozesstechnik).\n\n2. Das Gebäude wird überwiegend (zu mehr als 50 % der beheizten oder auch gekühlten Nettogrundfläche) zu Nichtwohnzwecken genutzt. Es handelt sich nach § 3 GEG grundsätzlich um ein Nichtwohngebäude. Nach Absatz 2 des § 106 GEG ist für gemischt genutzte Nichtwohngebäude wie folgt vorzugehen:\n• Ist der Flächenanteil der Wohnnutzung unerheblich (in der Regel bis zu 10 %), muss das Gebäude insgesamt als Nichtwohngebäude behandelt werden.\n• Ist der Flächenanteil der Wohnnutzung erheblich (in der Regel mehr als 10 %), muss der Wohngebäudeteil getrennt behandelt werden.\n\nAlternativ darf der Wohngebäudeteil für die BEG unabhängig vom Flächenanteil immer getrennt behandelt werden, sofern vollständige Wohneinheiten vorhanden sind.\n\nHinweis: In einem Nichtwohngebäude gelten wohnähnliche Nutzungen nicht als dem Wohnen dienende Nutzungen.\n\nDie Voraussetzungen, nach denen die Gebäudeteile gemischt genutzter Gebäude entweder gemeinsam oder getrennt zu betrachten sind, kommentiert die Auslegung XI-27 zu § 22 EnEV 2009 (Gemischt genutzte Gebäude)."}, {"nr": "1.02", "thema": "Wohnheime, Alten- und Pflegeheime", "relevanz": "WG, NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Nach Nummer 33 in § 3 Absatz 1 GEG zählen Wohnheime, Alten- und Pflegeheime sowie ähnliche Einrichtungen (z. B. Kinderheime, Betreutes Wohnen) zu den Wohngebäuden.\n\nFür Nutzungen in Wohn-, Alten- und Pflegeheimen, die der internen Nutzung dienen, wie z. B. Küchen, Wäscherei, Speise- und Gemeinschaftsräume oder auch Andachtsräume sowie Räume zur internen Verwaltung, kann angenommen werden, dass diese mit typischen Nutzungen in Wohngebäuden vergleichbar sind. Gleiches gilt für Bistros, Friseursalons oder Kioske, die ausschließlich der internen Nutzung der Bewohner dienen. Eine Betrachtung dieser Bereiche als Nichtwohnnutzung und somit getrennte Behandlung nach § 106 GEG wird für Wohnheime nicht vorgesehen.\n\nFür Nutzungen in Wohn-, Alten- und Pflegeheimen, die nicht ausschließlich der internen wohnähnlichen Nutzung dienen, wie etwa Bistros, Friseursalons oder Kioske, die der öffentlichen und somit gewerblichen Nutzung dienen, kann dagegen eine getrennte Behandlung als Nichtwohngebäude unter den Voraussetzungen des § 106 GEG erforderlich sein (siehe TFAQ 1.01 „Gemischt genutzte Gebäude\")."}, {"nr": "1.03", "thema": "Erweiterung, Ausbau bislang unbeheizter Räume, Wohngebäude", "relevanz": "WG", "section": "Allgemeine Grundlagen", "beschreibung": "Zwischen Ausbau und Erweiterung ist wie folgt zu unterscheiden: Bei dem „Ausbau unbeheizter Räume\" werden innerhalb eines bestehenden Gebäudes neue Wohnflächen geschaffen, z. B. durch den Ausbau eines bisher nicht ausgebauten Dachgeschosses. Bei der „Gebäudeerweiterung\" werden zusätzliche Wohnflächen durch die Errichtung neuer baulicher Anlagen geschaffen, z. B. durch Anbau oder Aufstockung.\n\n• Ausbau unbeheizter Räume\nDer Ausbau von zuvor nicht beheizten Räumen (z. B. Keller, Dachboden) ist in der BEG EM förderfähig. Dies gilt auch für Wohneinheiten, die ohne Einbezug bislang beheizter Flächen ausschließlich im Ausbau neu entstehen. Anders als in der BEG WG können diese der Bemessung des Förderhöchstbetrags in der BEG EM zugrunde gelegt werden.\n\n• Erweiterung von Wohngebäuden:\nBei der Erweiterung bestehender Wohngebäude (z. B. Anbau, Dachaufstockung) gilt für die\n• Förderung der energetischen Maßnahmen:\nDie energetischen Maßnahmen der Erweiterung werden in der BEG EM als Einzelmaßnahmen oder alternativ in der BEG WG als Sanierung zum Effizienzhaus gefördert.\n• Förderung neuer Wohneinheiten:\nFür die Förderung von Wohneinheiten, die im Zuge der Erweiterung neu entstehen, sind die folgenden Fälle zu unterscheiden:\n\no Fall 1:\nWird durch die Erweiterung eine neue Wohneinheit geschaffen, in welche zuvor bereits beheizte Flächen miteinbezogen sind, die also nicht ausschließlich in der Erweiterung neu entsteht, wird diese neue Wohneinheit als Sanierung gefördert und kann in der BEG EM oder alternativ in der BEG WG der Bemessung des Förderhöchstbetrags zugrunde gelegt werden.\nDies gilt auch bei Umwidmung von beheizten Nichtwohnflächen zu beheizten Wohnflächen: Sofern durch Umwidmung vormals beheizter Räume zu Wohnräumen eine neue Wohneinheit entsteht (mit Einbeziehen von zuvor beheizter Fläche), wird diese Wohneinheit in der BEG EM oder alternativ in der BEG WG als Sanierung gefördert (siehe auch TFAQ 1.06 „Umwidmung beheizter Gebäude\").\n\no Fall 2:\nWenn dagegen eine Wohneinheit ausschließlich in der Erweiterung neu entsteht, ohne dass in diese zuvor bereits beheizte Flächen miteinbezogen sind, wird die neue Wohneinheit ausschließlich als Neubau gefördert und kann nur in der BEG KFN bzw. BEG KNN der Bemessung des Förderhöchstbetrags zugrunde gelegt werden.\nDies gilt auch bei Umwidmung von unbeheizten Nichtwohnflächen zu beheizten Wohnflächen: Sofern durch Umwidmung vormals nicht beheizter Räume zu Wohnräumen eine neue Wohneinheit entsteht (ohne Einbeziehen von zuvor beheizter Fläche), ist eine Antragstellung für diese Wohneinheit nur in der BEG KFN bzw. BEG KNN als Neubau möglich (siehe auch TFAQ 1.07 „Umwidmung unbeheizter Gebäude\").\n\no Fall 3:\nWird für eine gemäß Fall 2 neu entstandene Wohneinheit keine Förderung in der BEG KFN bzw. BEG KNN als Neubau beantragt, können die energetischen Maßnahmen der Erweiterung im Rahmen des Förderhöchstbetrages für die bestehenden Wohneinheiten in der BEG EM oder alternativ in der BEG WG als Sanierung mitgefördert werden.\n\no Baudenkmale:\nEine Ausnahme bildet die Erweiterung von Baudenkmalen sowie von Gebäuden mit sonstiger besonders erhaltenswerter Bausubstanz im Sinne des § 105 GEG i. V. m. § 3 GEG. Neue Wohneinheiten, die im Zuge der Erweiterung von geschützten Gebäuden geschaffen werden, werden auch dann in der BEG EM oder alternativ in der BEG WG als Sanierung gefördert, wenn diese ausschließlich in der Erweiterung neu entstehen.\n\nAnbauten, die ein selbständiges neues Gebäude bilden, sind nicht als Erweiterung zu betrachten. Diese werden ausschließlich in der BEG KFN bzw. BEG KNN als Neubau gefördert."}, {"nr": "1.04", "thema": "Erweiterung, Ausbau von Nichtwohngebäuden", "relevanz": "NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Zwischen Ausbau und Erweiterung ist wie folgt zu unterscheiden: Bei dem „Ausbau unbeheizter Räume\" werden innerhalb eines bestehenden Gebäudes neue Nutzflächen geschaffen, z.B. durch den Ausbau eines bisher nicht ausgebauten Dachgeschosses. Bei der „Gebäudeerweiterung\" werden zusätzliche Nutzflächen durch die Errichtung neuer baulicher Anlagen geschaffen, z.B. durch Anbau oder Aufstockung.\n\n• Ausbau unbeheizter Flächen:\nDer Ausbau vormals unbeheizter Flächen eines Nichtwohngebäudes, z. B. Dachgeschossausbau, ist in der BEG EM förderfähig. Anders als in der BEG NWG gilt dies unabhängig von der Größe des auszubauenden Bereiches.\n\n• Erweiterung um bis zu 50 m² NGF\nDie Erweiterung (z. B. Anbau, Aufstockung) bestehender Nichtwohngebäude um eine zusammenhängende Nettogrundfläche (NGF) von bis zu 50 m² wird in der BEG EM oder alternativ in der BEG NWG als Sanierung zum Effizienzgebäude gefördert.\n\n• Erweiterung um mehr als 50 m² NGF:\nDie Erweiterung (z. B. Anbau, Aufstockung) bestehender Nichtwohngebäude um mehr als 50 m² zusammenhängende NGF wird ausschließlich in der BEG KFN bzw. BEG KNN als Neubau gefördert. Eine Förderung des Erweiterungsbaus in der BEG EM oder in der BEG NWG als Sanierung ist für diese nicht möglich.\n\n• Erweiterung von Denkmalen:\nBei unter Denkmalschutz stehenden Gebäuden ist durch Erweiterung neu entstehende Nichtwohnfläche als energetische Sanierung förderfähig, soweit diese Fläche Teil des thermisch konditionierten Gebäudevolumens ist.\n\nNicht als Erweiterung förderfähig sind Anbauten, die ein selbständiges neues Gebäude bilden oder durch die der Denkmalstatus des Gebäudes eingeschränkt oder aufgehoben wird.\n\n(siehe auch TFAQ 1.11 „Abgrenzung Gebäude / Gebäudeteile (insbesondere bei Gebäudenetzen)\", TFAQ 1.06 „Umwidmung beheizter Gebäude\" und TFAQ 1.07 „Umwidmung unbeheizter Gebäude\")"}, {"nr": "1.05", "thema": "entfällt", "relevanz": "", "section": "Allgemeine Grundlagen", "beschreibung": "entfällt"}, {"nr": "1.06", "thema": "Umwidmung beheizter Gebäude", "relevanz": "WG, NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Die Umwidmung (Nutzungsänderung) eines beheizten Gebäudes zu einem weiterhin beheizten Gebäude, wie etwa die Umnutzung eines beheizten Nichtwohngebäudes zu einem Wohngebäude, wird in der BEG EM oder alternativ in der BEG WG / BEG NWG als Sanierung gefördert.\n\nAls beheizt sind dabei solche Gebäude zu betrachten, die nach ihrer Zweckbestimmung vor der Umwidmung in den Geltungsbereich des GEG fielen. Dies gilt auch nach einem Leerstand und ebenso, wenn etwa die Heizungsanlage defekt ist oder ausgebaut wurde.\n\n(siehe auch TFAQ 1.10 „Beheizte und gekühlte Räume\", TFAQ 1.03 „Erweiterung, Ausbau bislang unbeheizter Räume, Wohngebäude\")"}, {"nr": "1.07", "thema": "Umwidmung unbeheizter Gebäude", "relevanz": "WG, NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Die Umwidmung eines bislang unbeheizten Gebäudes zu einem Wohngebäude oder zu einem beheizten oder auch gekühlten Nichtwohngebäude wird in der BEG KFN bzw. BEG KNN als Neubau gefördert.\n\nEine Förderung in der BEG EM ist bei der Umwidmung eines unbeheizten zu einem beheizten Gebäude nicht möglich.\n\nAls unbeheizt oder auch ungekühlt sind dabei auch solche Gebäude zu betrachten, die nach § 2 Absatz 2 GEG bisher nicht in den Geltungsbereich des GEG gefallen waren. Beispielsweise gelten danach Betriebsgebäude, die überwiegend zur Aufzucht oder zur Haltung von Tieren genutzt werden, als unbeheizt. Dies gilt auch dann, wenn diese bereichsweise, z. B. zur Tieraufzucht, auf mehr als 12 °C beheizt werden.\n\nWird ein solches Gebäude in der Art umgewidmet, dass es nach der Umwidmung in den Anwendungsbereich des GEG fällt, ist ausschließlich eine Förderung als Neubau möglich.\n\nEine Ausnahme bildet die Umwidmung von Baudenkmalen im Sinne des § 3 GEG sowie die Umwidmung zu einem Wohngebäude bei Gebäuden mit sonstiger besonders erhaltenswerter Bausubstanz. Diese werden auch dann in der BEG EM als Sanierung gefördert, wenn das Gebäude im Sinne des GEG bislang unbeheizt war.\n\nHinweis: Die Durchführung von Einzelmaßnahmen kann nur für Gebäude gefördert werden, die nach Fertigstellung bzw. nach Umsetzung aller Maßnahmen in den Anwendungsbereich des GEG fallen. Gebäude, deren Räume nach ihrer Zweckbestimmung thermisch nicht konditioniert werden, sowie Gebäude gemäß Absatz 2 des § 2 GEG fallen nicht in den Anwendungsbereich des GEG.\n\n(siehe auch TFAQ 1.03 „Erweiterung, Ausbau bislang unbeheizter Räume, Wohngebäude\")"}, {"nr": "1.08", "thema": "Abriss, Wiederaufbau", "relevanz": "WG, NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Die Zuordnung, nach der bei Teilabrissen oder Abrissen für den Wiederaufbau bzw. Umbau die Anforderungen entweder für zu errichtende Gebäude oder für bestehende Gebäude nach GEG einzuhalten sind, ergibt sich aus der Einordnung des Bauvorhabens für den öffentlich-rechtlichen Nachweis durch die zuständigen Bauaufsichtsbehörden.\n\nSofern für das Vorhaben keine Baugenehmigung einzuholen oder dieser keine Einordnung zu entnehmen ist, muss der beteiligte Energieeffizienz-Experte bzw. die beteiligte -Expertin oder alternativ das zur Antragstellung eingebundene Fachunternehmen das Vorhaben entsprechend bewerten.\n\nFür die Bewertung können die Hinweise zur Unterscheidung zwischen Neubau und Sanierung herangezogen werden, die in Punkt 3 der „Anwendungshinweise zum Vollzug des Erneuerbare-Energien-Wärmegesetzes, hier: Anwendung auf An- und Umbauten (Hinweis Nummer 2/2010)\" zu finden sind.\n\nBei einem Abriss bis auf die Grundmauern oder Bodenplatte, bei dem das Gebäude ansonsten vollständig erneuert wird, ist im Allgemeinen von der Einstufung als ein Neubau auszugehen.\n\nSofern das Vorhaben als Neubau eingestuft wird, ist eine Förderung von Einzelmaßnahmen in der BEG EM nicht möglich.\n\nIm Zweifelsfall sollte die Einordnung des Bauvorhabens mit der nach Landesrecht zuständigen Bauaufsichtsbehörde abgestimmt werden. Zuständig ist meist die unterste Bauaufsichtsbehörde, in deren Zuständigkeitsbereich das Gebäude fällt."}, {"nr": "1.09", "thema": "(Energie-) Bezugsfläche, Nichtwohngebäude", "relevanz": "NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Als Energiebezugsfläche bei Nichtwohngebäuden ist nach DIN V 18599-1: 2018-09 Abschnitt 8 in Verbindung mit § 3 Absatz 1 Nummer 22 GEG die Nettogrundfläche (NGF) nach DIN 277-1 zu verwenden, die beheizt oder gekühlt wird. Die Bestimmung der Nettogrundfläche folgt formal den Festlegungen zur Nettoraumfläche (NRF) nach DIN 277-1: 2021-08.\n\nThermisch nicht konditionierte Flächen, wie beispielsweise nicht beheizte, aber beleuchtete Flächen von Parkhäusern oder Abstellräumen, sind bei der Flächenermittlung nicht zu berücksichtigen.\n\nSofern es sich um Einzelmaßnahmen handelt, die sich nicht auf das gesamte Gebäude beziehen (z. B. Erneuerung der Innenbeleuchtung in Teilbereichen), ist nur der Teil der Nettogrundfläche maßgebend, auf den sich die Maßnahmen beziehen. Die gesamte Nettogrundfläche des Gebäudes ist in dem Fall nicht relevant.\n\nFalls es sich um Einzelmaßnahmen handelt, die sich auf das gesamte Gebäude beziehen (z. B. Dämmung von Dachflächen am gesamten Gebäude), kann die gesamte konditionierte Nettogrundfläche des Gebäudes als relevante Fläche angeben werden, soweit diese in den Anwendungsbereich des GEG fällt."}, {"nr": "1.10", "thema": "Beheizte und gekühlte Räume, Nichtwohngebäude", "relevanz": "NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Gemäß § 3 Absatz 1 Nummer 4 GEG ist ein \"beheizter Raum ein Raum, der nach seiner Zweckbestimmung direkt oder durch Raumverbund beheizt wird\". Dies gilt nach § 3 Absatz 1 Nummer 11 GEG analog für einen gekühlten Raum.\n\nDie \"Zweckbestimmung\" im Sinne des GEG umfasst auch das mit der geplanten oder vorhandenen technischen Ausstattung erreichbare Temperaturniveau zur Raumkonditionierung. Dies gilt auch dann, wenn die Beheizung bzw. Kühlung lediglich indirekt über Raumverbund erfolgt, z. B. bei innenliegenden Verkehrsflächen ohne Heiz- oder Kühlflächen.\n\nDie in den Nutzungsprofilen der DIN V 18599-10: 2018-09 genannten Raum-Solltemperaturen sind bei der Durchführung von Einzelmaßnahmen unverändert anzunehmen. Sie bilden die Grundlage für die energetischen Bauteilanforderungen in der BEG EM.\n\nEin Ansatz als \"niedrig beheizte Zone\" mit einer Raum-Solltemperatur < 19° C ist demnach regelmäßig nur für folgende Nutzungen zulässig:\n• Nutzungsprofil 22.1: Gewerbliche und industrielle Hallen - schwere Arbeit (15° C)\n• Nutzungsprofil 22.2: Gewerbliche und industrielle Hallen - mittelschwere Arbeit (17° C)\n• Nutzungsprofil 41: Lagerhallen, Logistikhallen (12° C)\nZudem dürfen solche Nutzungen optional als niedrig beheizt angesetzt werden, die in Tabelle 5 der DIN V 18599-10: 2018-09 mit der Fußnote n gekennzeichnet sind.\n\nBei allen anderen Nutzungen ist ein Ansatz als \"niedrig beheizte Zone\" mit einer Raum-Solltemperatur < 19° C nicht zulässig, Dies gilt auch dann, wenn die Zone (z. B. eine Sporthalle) in der Praxis mit einer Raum-Solltemperatur < 19° C betrieben wird bzw. betrieben werden soll.\n\nRäume, die ausschließlich zur Aufrechterhaltung eines industriellen oder gewerblichen Prozesses oder ausschließlich für Produktionsprozesse konditioniert werden, fallen nicht in den Anwendungsbereich des GEG."}, {"nr": "1.11", "thema": "Abgrenzung Gebäude / Gebäudeteile (insbesondere bei Gebäudenetzen)", "relevanz": "WG, NWG", "section": "Allgemeine Grundlagen", "beschreibung": "Die Abgrenzung zwischen Gebäuden und Gebäudeteilen erfolgt, wie bei Energieausweisen, gemäß § 79 Absatz 2 GEG.\n\nAusnahmen bilden gemischt genutzte Gebäude, sofern deren Gebäudeteile gemäß § 106 GEG getrennt zu betrachten sind (siehe TFAQ 1.01 „Gemischt genutzte Gebäude\") sowie neue Gebäudeteile bei Erweiterung oder Ausbau, für die gemäß TFAQ 1.03 „Erweiterung, Ausbau bislang unbeheizter Räume, Wohngebäude\" oder TFAQ 1.04 „Erweiterung, Ausbau von Nichtwohngebäuden\" eine separate Betrachtung zulässig ist.\n\nZu der Frage der Abgrenzung zwischen Gebäuden und Gebäudeteilen kann die Auslegung zu § 79 Absatz 2 Satz 1 GEG 2020 (Ausstellung von Energieausweisen für Wohngebäude) sinngemäß herangezogen werden. Demnach soll die Abgrenzung zwischen Gebäuden und Gebäudeteilen im Einzelfall anhand folgender Anhaltspunkte erfolgen:\n• die selbständige Nutzbarkeit\n• ein trennbarer räumlicher und funktionaler Zusammenhang\n• Abgrenzung durch die wärmeübertragende Umfassungsfläche\n• eigene Hausnummer\n• Eigentumsgrenzen\n• eigener Eingang\n• die Trennung durch Brandwände\n\nAnhand dieser Kriterien ist zu prüfen, welche Anhaltspunkte dafür sprechen, die Gesamtheit von Teilgebäuden als ein Gebäude im Sinne des GEG zu betrachten und welche Anhaltspunkte dafür sprechen, von mehreren Gebäuden auszugehen.\n\nLetztlich ist anhand dieser Anhaltspunkte von dem beteiligten Energieeffizienz-Experten oder der -Expertin (bzw. vom eingebundenen Fachunternehmen) eine individuelle Beurteilung vorzunehmen und zu dokumentieren. Dabei sprechen insbesondere eine selbständige Nutzbarkeit und ein trennbarer räumlicher und funktionaler Zusammenhang für das Vorliegen eines Gebäudes.\n\nEine Hilfestellung zur Anwendung der o. g. Kriterien gibt FAQ 10 b der Liste häufig gestellter Fragen zu Energieausweisen im Info-Portal Energieeinsparung des BBSR (siehe auch TFAQ 8.33 „Gebäudenetz, technische Mindestanforderungen an die Wärmeerzeuger\").\n\nIm Zweifelsfall sollte die Einordnung des Bauvorhabens mit der nach Landesrecht für den Vollzug des GEG zuständigen Bauaufsichtsbehörde abgestimmt werden. Zuständig ist meist die unterste Bauaufsichtsbehörde, in deren Zuständigkeitsbereich das Gebäude fällt."}, {"nr": "1.12", "thema": "Erfassung der Energieeffizienz, Befreiung von den Pflichtangaben", "relevanz": "WG", "section": "Allgemeine Grundlagen", "beschreibung": "Das BAFA erhebt im technischen Projektnachweis (TPN) Pflichtangaben zum Jahres-Primärenergiebedarf, Jahres-Endenergiebedarf, Transmissionswärmeverlust und zu den jährlichen CO2-Emissionen. Die Pflichtangaben sind auf Einzelmaßnahmen beschränkt, für die ein iSFP-Bonus gewährt werden kann, die also zuvor in einem, im Sinne der Richtlinie für die Bundesförderung für „Energieberatung für Wohngebäude (EBW)\" bonusfähigen, individuellen Sanierungsfahrplan (iSFP) oder Vor-Ort-Beratungsbericht benannt und bilanziert wurden.\n\nDie Angaben sind grundsätzlich der dem iSFP zugrundeliegenden Bilanzierung zu entnehmen. Mögliche Abweichungen hinsichtlich Reihenfolge, Kombination und Umfang der Maßnahmen, genauso wie abweichende technische Kennwerte der Umsetzung, sind adäquat abzubilden. Ist eine Korrektur der bilanzierten Maßnahmen oder Kombinationen notwendig, können die Pflichtangaben direkt aus der Bilanzsoftware entnommen werden. Es ist nicht nötig, mit der Druckapplikation einen neuen iSFP zu erzeugen.\n\nHaben die im BEG EM-Förderverfahren einbezogenen Energieeffizienz-Experten und -Expertinnen belegbar keinen Zugriff auf die dem iSFP zugrundeliegenden Bilanzierungsdaten und können diese auch unter vertretbarem Aufwand nicht beschaffen, ist eine fallbezogene Entbindung von der Verpflichtung zur Datenabgabe möglich. Der Aufwand für die Datenbeschaffung gilt beispielsweise dann als zu hoch, wenn der iSFP in einem fremden Beratungsbüro erstellt wurde und damit eine erneute Aufnahme der Gebäudedaten nötig würde. Zu einer möglichen Befreiung von der Pflicht zur Datenerfassung kann im TPN-Formular eine Erklärung abgegeben werden.\n\nDie Nachbilanzierung kann auf Grundlage der zum Förderzeitpunkt gültige Richtlinie für die Bundesförderung für \"Energieberatung für Wohngebäude (EBW)\" und dem Merkblatt für die Erstellung des iSFP vorgenommen werden.\n\n(siehe auch TFAQ 3.02 „Bekanntmachung, fehlende Kennwerte für Bauteile\")"}, {"nr": "2.01", "thema": "Allgemeine Anforderungen", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Bei der Durchführung von Einzelmaßnahmen an der Gebäudehülle besteht die Anforderung, zu prüfen, ob Maßnahmen zum Feuchteschutz insbesondere zur Vermeidung von Tauwasserausfall und Schimmelpilzbildung durch Einhaltung des Mindestluftwechsels und des Mindestwärmeschutzes erforderlich sind. Darüber hinaus ist bei allen Maßnahmen auf eine wärmebrückenreduzierte und luftdichte Ausführung zu achten.\n\nDiese generellen Anforderungen beziehen sich ausschließlich auf die geplante Einzelmaßnahme. Darüber hinausgehende Anforderungen an das Gesamtgebäude bzw. an Bauteile des Gebäudes, die von Einflüssen der jeweiligen Einzelmaßnahme nicht betroffen sind, bestehen nicht."}, {"nr": "2.02", "thema": "Mindestwärmeschutz", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Mindestanforderungen an den Wärmeschutz im Winter regelt DIN 4108-2: 2013-02. Der Mindestwärmeschutz dient der Sicherstellung eines hygienischen Raumklimas zur Vermeidung von Schimmelpilzbildung an Innenoberflächen sowie in Kanten und Ecken von Außenbauteilen unter Norm-Randbedingungen.\n\nDIN 4108-2: 2013-02 definiert dazu Anforderungen an den Mindestwärmeschutz flächiger Bauteile sowie an den Mindestwärmeschutz im Bereich von Wärmebrücken (siehe TFAQ 2.05 „Mindestwärmeschutz im Bereich von Wärmebrücken\" und TFAQ 2.03 „Mindestluftwechsel, Lüftungskonzept bei Wohngebäuden\").\n\nDie Mindestanforderungen an den winterlichen Wärmeschutz nach DIN 4108-2: 2013-02 gelten für zu errichtende Gebäude, für Erweiterungen bestehender Gebäude und für neue Bauteile in bestehenden Gebäuden."}, {"nr": "2.03", "thema": "Mindestluftwechsel, Lüftungskonzept bei Wohngebäuden", "relevanz": "WG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Im Rahmen geförderter Sanierungsmaßnahmen, die die Luftdichtheit eines Wohngebäudes erhöhen (z. B. Fensteraustausch, Dachdämmung), ist die Notwendigkeit lüftungstechnischer Maßnahmen zur Vermeidung von Tauwasser- und Schimmelpilzbildung zu prüfen. Hierzu ist ein Lüftungskonzept zu erstellen, in dem der erforderliche Außenluftvolumenstrom und die Lösung zur Umsetzung spezifiziert werden, z. B. unter Anwendung der DIN 1946-6.\n\nDie Feststellung, ob lüftungstechnische Maßnahmen erforderlich sind, kann bei Wohngebäuden mit dem „OnlineCheck Wohnungslüftung\" erfolgen, der auf den Seiten des VdZ-Wirtschaftsvereinigung Gebäude und Energie e. V. angeboten wird.\n\nAls Mindestanforderung ist anhand des Lüftungskonzeptes festzustellen, ob lüftungstechnische Maßnahmen zur Sicherstellung des Feuchteschutzes notwendig sind.\n\nDie Veranlassung der Umsetzung lüftungstechnischer Maßnahmen verantwortet der Förderempfänger."}, {"nr": "2.04", "thema": "Mindestluftwechsel, Lüftungskonzept bei Nichtwohngebäuden", "relevanz": "NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Im Rahmen geförderter Sanierungsmaßnahmen, die die Luftdichtheit eines Nichtwohngebäudes erhöhen (z. B. Fensteraustausch, Dachdämmung), ist die Notwendigkeit lüftungstechnischer Maßnahmen zur Vermeidung von Tauwasser- und Schimmelpilzbildung sowie ggf. zur Abfuhr von Gerüchen und Schadstoffbelastungen zu prüfen. Hierzu ist ein Lüftungskonzept zu erstellen, in dem der erforderliche Außenluftvolumenstrom und die Lösung zur Umsetzung spezifiziert werden. Hieraus resultierende Maßnahmen sind umzusetzen.\n\nInhalt und Form eines Lüftungskonzeptes für Nichtwohngebäude sind dabei von den Anforderungen der Nutzung und des Gebäudes abhängig. Insbesondere ist der nach Arbeitsstättenverordnung und den zugeordneten Technischen Regeln erforderliche Außenluftvolumenstrom zu bestimmen und darzulegen, wie dieser gesichert wird.\n\nWelche Lüftungsart zum Einsatz kommen soll, ist unter anderem das Ergebnis der im Rahmen eines Lüftungskonzeptes anzustellenden Überlegungen. Dabei kann der erforderliche Außenluftvolumenstrom nach DIN EN 16798-1 festgelegt werden. Darauf aufbauend kann eine eventuell erforderliche anlagentechnische Lösung gemäß DIN EN 16798-3 und TR 16798-4 definiert werden.\n\nEin Lüftungskonzept muss nicht zwingend dazu führen, dass eine mechanische Lüftungsanlage vorgesehen wird, wenn die Anforderungen auch mit freier Lüftung erfüllt werden.\n\nWeitere Informationen enthält die Broschüre „Anforderungen an Lüftungskonzeptionen von Gebäuden\" des Umweltbundesamtes. Der Teil I dieser Broschüre bezieht sich zwar primär auf Bildungsbauten, er enthält jedoch eine Definition eines Lüftungskonzeptes, die auch auf andere Gebäudearten übertragbar ist."}, {"nr": "2.05", "thema": "Mindestwärmeschutz im Bereich von Wärmebrücken", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "DIN 4108-2: 2013-02 regelt in Abschnitt 6 Anforderungen an den Mindestwärmeschutz im Bereich von Wärmebrücken zur Vermeidung von Tauwasserausfall und Schimmelpilzbildung.\n\nDanach ist bei Standardrandbedingungen (20 °C Raumlufttemperatur und 50 % relative Raumluftfeuchte) an der ungünstigsten Stelle ein Temperaturfaktor von fRsi ≥ 0,70 bzw. eine Oberflächentemperatur von mindestens 12,6 °C unter den in DIN 4108-2 vorgegebenen Randbedingungen einzuhalten. Für abweichende Nutzungsrandbedingungen, wie ggf. für Nutzungen in Nichtwohngebäuden, sind die erforderlichen Maßnahmen anhand des nutzungsspezifischen Raumklimas festzulegen.\n\nFür Bauteilanschlüsse, die gleichwertig zu den Planungsbeispielen der DIN 4108 Beiblatt 2 ausgeführt werden, kann die Einhaltung der Mindestanforderungen an den Wärmeschutz ohne weiteren Nachweis vorausgesetzt werden. Diese gelten nach DIN 4108-2 als ausreichend gedämmt.\n\nBei einem Austausch von Fenstern kann für die Sanierung der Wärmebrücke am Anschluss der neuen Fenster das VFF Merkblatt ES.06 (Handlungsempfehlungen zur schimmelpilzfreien Teilmodernisierung mit Fenstern) als Arbeitshilfe vereinfachend verwendet werden (www.window.de, Downloads).\n\nHinweis: Die Anforderungen an Wärmebrücken nach DIN 4108-2: 2013-02 gelten nicht für Räume, die ihrer Bestimmung nach auf niedrige Innentemperaturen (≥ 12 °C) und (< 19 °C) beheizt werden.\n\n(siehe auch TFAQ 2.02 „Mindestwärmeschutz\")"}, {"nr": "2.06", "thema": "Wärmebrückenkonzept", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Bei der Durchführung von Einzelmaßnahmen bei Wohngebäuden und bei normal beheizten Räumen von Nichtwohngebäuden sind für die betroffenen Bauteilanschlüsse Konstruktionsprinzipien zur wärmebrückenreduzierten Ausführung zu bestimmen und zu dokumentieren, wie beispielsweise bei einem Austausch der Fenster für die Bauteilanschlüsse der neuen Fenster.\n\nGrundsätzliches Ziel ist die Entwicklung geeigneter und angemessener Konstruktionsprinzipien zur Verbesserung von Wärmebrückenanschlüssen für die betroffene Einzelmaßnahme. Als Orientierung können die Planungsbeispiele der DIN 4108 Beiblatt 2 dazu herangezogen werden. Als Arbeitshilfe können die Konstruktionsempfehlungen in dem \"Wärmebrücken in der Bestandssanierung\" sowie die Erläuterungen zur Anwendung der DIN 4108 Beiblatt 2 in der Broschüre „Die Wärmebrückenbewertung bei der energetischen Bilanzierung von Gebäuden\" dienen.\n\nNotwendige Nachweise können grafisch oder bildhaft erfolgen.\n\nBei der zeitlich gestuften Durchführung von Einzelmaßnahmen, wie etwa dem Austausch von Fenstern vor einer späteren Dämmung der Außenwände, kann als Mindestanforderung an die Berücksichtigung einer wärmebrückenreduzierten Ausführung die Prüfung notwendiger Maßnahmen zur Vermeidung von Schimmelpilzbildung nachgewiesen werden (siehe auch TFAQ 2.05 „Mindestwärmeschutz im Bereich von Wärmebrücken\")."}, {"nr": "2.07", "thema": "Luftdichtheitskonzept", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Bei Wohn- und Nichtwohngebäuden ist bei allen Maßnahmen auf eine wärmebrückenreduzierte und möglichst luftdichte Ausführung zu achten. Die Berücksichtigung der Luftdichtheit bei der Durchführung von Einzelmaßnahmen kann anhand eines Luftdichtheitskonzeptes nachgewiesen werden.\n\nBei der Durchführung von Einzelmaßnahmen sind für die betroffenen Bauteilanschlüsse Konstruktionsprinzipien zur luftdichten Ausführung zu bestimmen und zu dokumentieren, wie beispielsweise bei einem Austausch der Fenster für die Bauteilanschlüsse der neuen Fenster.\n\nIn DIN V 4108-7: 2011-01 werden dazu Prinzipien für eine umlaufende Luftdichtheitsebene, Beispiele luftdichter Bauteilanschlüsse und Empfehlungen zur Ausführung beschrieben.\n\nEine Hilfestellung bei der Planung, Ausschreibung und Umsetzung von einfachen Luftdichtheitskonzepten bietet der \"Leitfaden Luftdichtheitskonzept\"."}, {"nr": "2.08", "thema": "Sommerlicher Wärmeschutz", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Für Maßnahmen zum sommerlichen Wärmeschutz, d. h. bei Ersatz oder erstmaligen Einbau von außenliegenden Sonnenschutzeinrichtungen mit optimierter Tageslichtversorgung (z. B. über Lichtlenksysteme oder strahlungsabhängige Steuerung), wird die Einhaltung der Vorgaben der DIN 4108-2: 2013-02 durch Sonnenschutzvorrichtungen nach Tabelle 7 Zeilen 3.1 bis 3.3 (unabhängig von der Art des Antriebes) zum sommerlichen Wärmeschutz gefordert (ausgeschlossen sind Sonnenschutzvorrichtungen nach Zeile 3.4 „Vordächer, Markisen allgemein, freistehende Lamellen\"). Hierbei werden ausschließlich Maßnahmen zum sommerlichen Wärmeschutz in der thermischen Gebäudehülle eingeschlossen, die parallel zur Verglasungsfläche installiert werden.\n\nDazu ist mindestens ein Nachweis nach DIN 4108-2: 2013-02 für den Raum zu führen, für den sich die höchsten Anforderungen bezüglich des sommerlichen Wärmeschutzes ergeben. Dabei sind nur solche Räume zu berücksichtigen, die im Rahmen der Einzelmaßnahme mit einer geförderten Sonnenschutzeinrichtung versehen werden. Werden die Anforderungen für den kritischen Raum eingehalten, kann die Einhaltung auch für die anderen Räume (bei gleichen Fenstern, gleicher Bauweise sowie gleichen Sonnenschutzsystemen) angenommen werden.\n\nWird die Installation von Sonnenschutzeinrichtungen dagegen im Zusammenhang mit der geförderten Erneuerung oder Ertüchtigung von Fenstern, Dachflächenfenstern oder Vorhangfassaden als Umfeldmaßnahme mitgefördert, ist ein Nachweis des sommerlichen Wärmeschutzes nach DIN 4108-2: 2013-02 für die Förderung nicht erforderlich."}, {"nr": "2.09", "thema": "Bauteilanforderungen bei Baudenkmalen und besonders erhaltenswerter Bausubstanz", "relevanz": "WG, NWG", "section": "Einzelmaßnahmen an der Gebäudehülle, allgemein", "beschreibung": "Die Tabelle der Technischen Mindestanforderungen enthält angepasste Anforderungswerte für Baudenkmale und für sonstige besonders erhaltenswerte Bausubstanz. Bei sonstiger besonders erhaltenswerter Bausubstanz dürfen die angepassten Anforderungswerte ausschließlich bei Wohngebäuden angewendet werden. Bei Nichtwohngebäuden gelten die angepassten Anforderungswerte für Bauteile ausschließlich für Baudenkmale."}, {"nr": "3.01", "thema": "Darstellung U-Wert", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Für den Nachweis bei Durchführung von Einzelmaßnahmen sind U-Werte den dargestellten Anforderungswerten entsprechend mit zwei wertanzeigenden Stellen nachzuweisen. Dazu können U-Werte größer oder gleich 1,0 W/(m² · K) mit einer Nachkommastelle dargestellt werden, U-Werte kleiner 1,0 W/(m² · K) sind mit zwei Nachkommastellen anzugeben.\n\nDie Nachkommastellen sind dabei kaufmännisch zu runden."}, {"nr": "3.02", "thema": "Bekanntmachung, fehlende Kennwerte für Bauteile", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Bei dem Nachweis für Einzelmaßnahmen dürfen Regeln zur vereinfachten Ermittlung der energetischen Qualität bestehender Bauteile gemäß GEG verwendet werden, soweit Kennzahlen für deren energetische Eigenschaften fehlen.\n\nNach § 50 Absatz 4 GEG können in Fällen, in denen für bestehende Bauteile keine Kennwerte für die energetischen Eigenschaften vorliegen, die Regeln zur vereinfachten Ermittlung der energetischen Qualität nach der vom BMWE/BMI veröffentlichten \"Bekanntmachung der Regeln zur Datenaufnahme und Datenverwendung im Wohngebäudebestand\" und \"Bekanntmachung der Regeln zur Datenaufnahme und Datenverwendung im Nichtwohngebäudebestand\" vom 8. Oktober 2020 verwendet werden.\n\n• Nach Nummer 3.1 der Bekanntmachung können U-Werte von Außenbauteilen regionaltypischer Bauweisen unter Verwendung der in der \"Deutschlandkarte für Altbaumaterialien und -konstruktionen\" veröffentlichten Werte ermittelt werden. Diese enthält nach Region, Baualter und Konstruktion unterschiedene Bauteilaufbauten sowie dazugehörige Materialkennwerte, die für die eigene Ermittlung von U-Werten herangezogen werden können.\n\nSoweit dies mangels spezifischer Erkenntnisse nicht möglich ist, können\n• nach Nummer 3.2 der Bekanntmachung, die in Tabelle 2 und Tabelle 3 veröffentlichten pauschalen U-Werte für nicht nachträglich gedämmte Bauteile verwendet werden. Die Tabellen enthalten Pauschalwerte für bestimmte Konstruktionen und Baualtersklassen.\n• nach Nummer 3.3 der Bekanntmachung bei nachträglich gedämmten Bauteilen pauschale U-Werte aus Tabelle 2 nach einer hier vorgegebenen Korrektur verwendet werden.\n\nEbenfalls möglich ist die Verwendung von Kennwerten aus qualifizierten Gebäudetypologien, wie z. B. Typologien der Länder oder Kommunen.\n\nUnabhängig davon, dass eine vereinfachte Ermittlung der energetischen Qualität bestehender Bauteile zulässig ist, sollten Bauteile auf Basis einer möglichst detaillierten Bestimmung des vorhandenen Bauteilaufbaus bewertet werden."}, {"nr": "3.03", "thema": "U-Wert, Berechnung", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Für die Berechnung von U-Werten sind gemäß GEG folgende Berechnungsverfahren anzuwenden:\n1. DIN V 18599-2: 2018-09 Abschnitt 6.1.4.3 für die Berechnung der an Erdreich grenzenden Bauteile\n2. DIN 4108-4: 2017-03 in Verbindung mit DIN EN ISO 6946: 2008-04 für die Berechnung opaker Bauteile\n3. DIN 4108-4: 2017-03 für die Berechnung transparenter Bauteile sowie von Vorhangfassaden.\n\n(siehe auch TFAQ 3.09 „Ueff-Wert, dynamischer U-Wert\")"}, {"nr": "3.04", "thema": "U-Wert von inhomogenen Bauteilen/ Dachdämmung", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Für inhomogene Bauteile aus nebeneinanderliegenden, unterschiedlichen Schichten (wie z. B. bei Dächern mit einer Zwischensparrendämmung) ist der U-Wert nach den Regelungen der DIN EN ISO 6946: 2008-04 in Abschnitt 6.2 zu ermitteln. Der U-Wert ergibt sich danach aus dem arithmetischen Mittel des oberen und unteren Grenzwertes für den Wärmedurchgangswiderstand RT näherungsweise als Mittelwert für die unterschiedlichen Schichtaufbauten.\n\nZu einer fachgerechten U-Wert-Berechnung gehört somit z. B. die Berücksichtigung des Sparrenanteils für ein Dach in Holzkonstruktion. Entsprechend ist bei Wänden, Decken und Böden in Holzleichtbauweise zu verfahren."}, {"nr": "3.05", "thema": "U-Wert von Bauteilen mit keilförmigen Dämmschichten", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Der U-Wert eines Bauteils mit keilförmiger Dämmschicht, wie beispielsweise der Gefälledämmung eines Flachdachs, ist nach Anhang C der DIN EN ISO 6946 zu ermitteln. Die keilförmige Dämmschicht ist danach zunächst in geometrische Flächen zu unterteilen, die in DIN EN ISO 6946 Abschnitt C.2 beschrieben werden, und der U-Wert für jede Einzelfläche zu berechnen. Der U-Wert für die gesamte Dachfläche wird anschließend aus den berechneten Einzelwerten flächengewichtet als mittlerer U-Wert ermittelt.\n\nVereinfachend kann für den Nachweis bei Antragstellung die mittlere Höhe für die keilförmige Dämmschicht zur näherungsweisen Ermittlung des U-Wertes angesetzt werden. Es ist dann darauf zu achten, dass bei Herstellung und Ausführung der Dämmschicht der U-Wert nach dem Normverfahren der DIN EN ISO 6946 eingehalten wird.\n\nHinweis: Bei einer Gefälledämmung muss die Dämmschicht am niedrigsten Punkt mindestens die Anforderungen an den Mindestwärmeschutz nach DIN 4108-2 einhalten."}, {"nr": "3.06", "thema": "U-Wert von Bauteilen mit stark belüfteten Luftschichten", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Nach DIN EN ISO 6946 ist der Wärmedurchgangswiderstand eines Bauteils mit einer stark belüfteten Luftschicht (z. B. bei vorgehängten hinterlüfteten Fassaden oder hinterlüfteten Dacheindeckungen) zu bestimmen, indem der Wärmedurchlasswiderstand der Luftschicht und aller anderen Schichten zwischen Luftschicht und Außenumgebung vernachlässigt wird und für den äußeren Wärmeübergangswiderstand (Rse) ein Wert verwendet wird, der dem bei ruhender Luft entspricht. D. h. es darf für Rse der gleiche Wert wie für den inneren Wärmeübergangswiderstand (Rsi) desselben Bauteils nach Tabelle 1 der DIN EN ISO 6946 verwendet werden.\n\n(siehe auch TFAQ 4.07 „UCW-Wert von Vorhangfassaden\")"}, {"nr": "3.07", "thema": "U-Wert von Bodenflächen gegen Erdreich", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Bei der Berechnung des U-Wertes für eine Bodenfläche bleiben Schichten wie Schüttlagen (Sauberkeitsschicht, Dränschicht, u. ä.) unterhalb der Bodenplatte unberücksichtigt. Diese dürfen ebenso wie das darunterliegende Erdreich nicht als wirksame Bauteilschichten angesetzt werden.\n\nDämmschichten unterhalb der Bodenplatte dürfen bei Berechnung des U-Wertes berücksichtigt werden, sofern diese für die Anwendung als Perimeterdämmung (PB) genormt oder zugelassen sind."}, {"nr": "3.08", "thema": "U-Wert von Außenwänden, Brandriegel bei WDVS", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Mineralische Brandriegel, die aufgrund der Anforderungen an den Brandschutz innerhalb von Wärmedämmverbundsystemen z. B. oberhalb von Außenwandöffnungen zur Brandabschottung eingebaut werden müssen, können bei der Ermittlung des U-Wertes von Außenwänden unberücksichtigt bleiben."}, {"nr": "3.09", "thema": "Ueff-Wert, dynamischer U-Wert", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Im Rahmen des GEG sowie der BEG EM ist ein effektiver U-Wert, in dem die Speicherwirkung des Bauteils mitberücksichtigt wird oder ein dynamischer U-Wert, in dem Wärmegewinne etwa aus solarer Einstrahlung oder Bauteiltemperierung mitberücksichtigt werden, als Nachweiswert nicht zulässig (siehe TFAQ 3.03 „U-Wert, Berechnung\")."}, {"nr": "3.10", "thema": "Bauteilzuordnung Geschossdecken", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Der Bauteilgruppe „Dachflächen sowie Decken und Wände gegen unbeheizte Räume, Bodenflächen\" sind Geschossdecken wie folgt zuzuordnen:\n• Geschossdecken, die thermisch konditionierte Räume nach oben gegen einen unbeheizten Dachraum abgrenzen, sind dem Bauteil \"Oberste Geschossdecken gegen unbeheizte Dachräume\" zuzuordnen.\n• Geschossdecken, die thermisch konditionierte Räume nach oben gegen Außenluft abgrenzen, wie z. B. bei einem Staffelgeschoss vorgelagerte Dachterrassen, sind dem Bauteil \"Flachdächer\" zuzuordnen.\n• Geschossdecken, die konditionierte Räume nach unten gegen Außenluft abgrenzen, wie z. B. Geschossdecken über Durchfahrten, sind dem Bauteil \"Geschossdecke gegen Außenluft nach unten\" zuzuordnen.\n• Geschossdecken, die konditionierte Räume zu unbeheizten Räumen (mit Ausnahme von Dachräumen) abgrenzen sind dem Bauteil \"Decken gegen unbeheizte Räume sowie Kellerdecken\" zuzuordnen."}, {"nr": "3.11", "thema": "Bauteile an Tiefgaragen/Garagen angrenzend", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Außenbauteile von thermisch konditionierten Räumen, die an Tiefgaragen oder Garagen grenzen, sind als gegen Außenluft angrenzende Bauteile zu betrachten.\n\nIn DIN V 18599-2: 2018-09 Tabelle 5 ist etwa für das Bauteil Decke über Tiefgarage ein Fx-Wert von 1,0 festgesetzt. Danach sind Außenbauteile beheizter oder auch gekühlter Räume, die an Tiefgaragen grenzen, als gegen Außenluft angrenzende Bauteile zu betrachten. Entsprechendes gilt für vergleichbare Gebäudeteile, wie für übliche Garagen oder wie beispielsweise für Logistikhallen, die großflächig und langanhaltend offengehalten werden müssen.\n\nAnders verhält es sich bei Tiefgaragen, Garagen oder vergleichbaren Gebäudeteilen, für die angenommen werden kann, dass sich kein Außentemperaturniveau darin einstellen wird, z. B. wenn diese nicht natürlich oder nicht stark belüftet werden sowie über automatisch und dicht schließende Tore verfügen. In diesem Fall können die daran angrenzenden wärmeübertragenden Bauteile als Bauteile gegen unbeheizten Raum betrachtet werden."}, {"nr": "3.12", "thema": "Maximaler U-Wert, technische Grenzen", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Kann bei Dämmmaßnahmen für eine Teilfläche eines Bauteils die Bauteilanforderung aufgrund technischer Grenzen nicht vollständig erfüllt werden, können Maßnahmen an dieser Teilfläche dennoch mitgefördert werden, wenn der flächengewichtete mittlere U-Wert für die gesamte nachträglich gedämmte Bauteilfläche den Anforderungswert erfüllt.\n\nIst beispielsweise bei der Dämmung von Außenwänden an einem Gebäuderücksprung wegen seitlich anschließender Fenster oder Türen die einzubauende Dämmschichtdicke für diesen Wandabschnitt begrenzt, kann die Dämmung dieses Wandabschnittes dennoch mitgefördert werden, wenn der flächengewichtete mittlere U-Wert für die insgesamt gedämmten Außenwandflächen den Anforderungswert erfüllt."}, {"nr": "3.13", "thema": "Zweischalige Industriefassaden (Kassettenprofile)", "relevanz": "NWG", "section": "Bauteile der Gebäudehülle, opake Bauteile", "beschreibung": "Bei zweischaligen Industriefassaden für Stahlkassettenwände können alternativ zur Bestimmung des U-Wertes nach DIN EN ISO 6946 das Nomogramm-Verfahren des Fachverbandes für Bausysteme im Metallleichtbau (IFBS-Schrift 4.05) oder numerische Verfahren basierend auf DIN EN ISO 10211 verwendet werden.\n\nErgänzend sind Zulassungen der Hersteller sowie allgemeine Regeln der Technik zu beachten.\n\n(siehe auch TFAQ 3.09 „Ueff-Wert, dynamischer U-Wert\")"}, {"nr": "4.01", "thema": "UW-Wert, Darstellung", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Der Wärmedurchgangskoeffizient UW für Fenster- und Fenstertüren kann entsprechend der Darstellung der Anforderungswerte mit zwei wertanzeigenden Stellen nachgewiesen werden, d. h. UW-Werte größer oder gleich 1,0 W/(m² · K) können mit einer Nachkommastelle dargestellt werden, UW-Werte kleiner 1,0 W/(m² · K) sind mit zwei Nachkommastellen anzugeben.\n\nDie Nachkommastellen sind dabei kaufmännisch zu runden."}, {"nr": "4.02", "thema": "UW-Wert von senkrecht eingebauten Fenstern und Fenstertüren", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Die Verfahren zur Bestimmung von UW für Fenster sind in der Produktnorm DIN EN 14351-1 festgelegt. Danach ist UW nach DIN EN ISO 10077-1 zu ermitteln oder nach DIN EN ISO 12567 zu messen.\n\nFür die Verwendung von UW-Werten bestehen folgende Möglichkeiten:\n• Gemäß DIN V 4108-4 darf der vom Hersteller nach DIN EN 14351-1 für ein Fenster mit Standardgröße (1,23 m x 1,48 m bzw. für Größen > 2,3 m² 1,48 m x 2,18 m) und mit gleicher Bauart deklarierte UW-Wert angesetzt werden. Gleiche Bauart liegt vor, wenn das deklarierte Normfenster aus den gleichen Komponenten wie Rahmenmaterial und -bauart, Verglasung und Glasrandverbund wie das geplante Fenster zusammengesetzt ist.\nAus der Herstellerbescheinigung muss neben dem deklarierten UW-Wert und dem deklarierten Produkt (z. B. Fenster, Typkennung, etc.) der Normbezug (DIN EN 14351-1) eindeutig hervorgehen.\n• Es kann ein nach DIN EN ISO 10077-1 ermittelter UW-Wert angesetzt werden. Für die zugrunde zu legende Fenstergröße bestehen folgende Möglichkeiten:\no Für Fenster mit gleicher Bauart darf UW anhand der Standardgröße gemäß DIN EN 14351-1 (1,23 m x 1,48 m bzw. für Größen > 2,3 m² 1,48 m x 2,18 m) ermittelt werden\noder\no Der UW-Wert wird anhand der tatsächlichen Fenstergröße für jedes Fenster ermittelt. Alternativ zum Ansatz der Einzelwerte darf der daraus flächengewichtete Mittelwert für UW verwendet werden.\n\nAus der dokumentierten Ermittlung müssen die zugrunde gelegte Fenstergröße und die bei der Ermittlung angesetzten Eingangsgrößen (z. B. Uf, Ug) eindeutig hervorgehen.\n\nHinweis: Für Sprossen sind Zuschläge gemäß DIN EN 14351-1 hinzuzurechnen, wenn diese nicht bereits bei der Ermittlung oder Messung des UW-Wertes berücksichtigt wurden."}, {"nr": "4.03", "thema": "UW-Wert von Fenstern mit Paneelen", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Der UW-Wert für ein Fensterelement mit opaker Füllung (Paneel) kann nach DIN EN ISO 10077-1 Gleichung 3 berechnet werden.\n\nDie Regelung betrifft ausschließlich in DIN EN ISO 10077 beschriebene Fensterelemente, die etwa in Wandöffnungen von üblichen Lochfassaden eingebaut werden."}, {"nr": "4.04", "thema": "Sonderverglasung", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Als Sonderverglasung gelten die in Fußnote 15 der Anlage 7 GEG beschriebenen Verglasungen zum Schallschutz, Brandschutz sowie Durchschusshemmung, Durchbruchhemmung oder Sprengwirkungshemmung, die aufgrund von Vorschriften der Landesbauordnung oder anderer Vorschriften zur Einhaltung öffentlich-rechtlicher Schutzziele für den bestimmungsgemäßen Betrieb eines Gebäudes einzubauen sind.\n\nAls Sonderverglasung gelten nach Anlage 7 GEG:\n• Schallschutzverglasungen mit einem bewerteten Schalldämmmaß der Verglasung von RW,R ≥ 40 dB nach DIN EN ISO 717-1: 2013-06 oder einer vergleichbaren Anforderung\n• Isolierglas-Sonderaufbauten zur Durchschusshemmung, Durchbruchhemmung oder Sprengwirkungshemmung nach anerkannten Regeln der Technik\n• Isolierglas-Sonderaufbauten als Brandschutzglas mit einer Einzelelementdicke von mindestens 18 mm nach DIN 4102-13: 1990-05 oder einer vergleichbaren Anforderung"}, {"nr": "4.05", "thema": "UW-Wert, Ertüchtigung", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Unter der Ertüchtigung eines Fensters oder einer Fenstertür ist etwa der Einbau einer neuen Verglasung in den bestehenden Fensterrahmen zu verstehen.\n\nDie Anforderung an den UW-Wert bei einer Ertüchtigung besteht an das Fenster (aus Rahmen, Verglasung und Glasrandverbund) und ist somit für den UW-Wert des Fensters einzuhalten.\n\nFür den Nachweis kann nach einer der unter TFAQ 4.02 „UW-Wert von senkrecht eingebauten Fenstern und Fenstertüren\" beschriebenen Möglichkeiten vorgegangen werden.\n\nFür die Ermittlung des UW-Wertes nach DIN EN ISO 10077-1 sind die Bauteile des Fensters (Fensterrahmen, Verglasung und Glasrandverbund) zu berücksichtigen. Die Kennwerte der Bauteile können Produktdeklarationen entnommen werden. Liegen diese etwa für den bestehenden Rahmen nicht vor, können Uf-Werte für Fensterrahmen dem Anhang F der DIN EN ISO 10077-1 entnommen werden.\n\n(siehe auch TFAQ 4.06 „Ertüchtigung von Fenstern, Mindestanforderungen\")"}, {"nr": "4.06", "thema": "Ertüchtigung von Fenstern, Mindestanforderungen", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Bei der Ertüchtigung von Fenstern, Balkon- und Terrassentüren, von Kastenfenstern sowie von Fenstern mit Sonderverglasungen müssen mindestens folgende Maßnahmen durchgeführt werden:\n• Überarbeitung der Rahmen und Flügel\n• Herstellung von Gang- und Schließbarkeit\n• Erneuerung bzw. Einbau von Dichtungen (z. B. Falzdichtung, Lippendichtung)\n• Dämmung der Einbaufuge\n• Herstellung eines luftdichten Anschlusses innen\n• Herstellung eines schlagregendichten Anschlusses außen\n\nVon diesen Mindestanforderungen kann abgewichen werden, wenn diese belegbar Anforderungen des Denkmalschutzes zuwiderlaufen.\n\nBei der Ertüchtigung kann darüber hinaus ein Austausch der Verglasung erfolgen. Ebenso zählt die Erneuerung eines Fensterflügels zu einer Ertüchtigung. Zur Ertüchtigung zählt auch der Fall, dass bei einem Kastenfenster eines der hintereinander angeordneten Fenster erneuert wird, wie auch der Fall, dass zum Erhalt bestehender Fenster durch Einbau eines weiteren Fensters ein Kastenfenster hergestellt wird (in diesem Fall gelten die TMA für neu eingebaute Fenster, Balkon- oder Terrassentüren). Die Anforderung ist jeweils für das Kastenfenster aus beiden hintereinander angeordneten Fenstern einzuhalten.\n\n(siehe auch TFAQ 4.05 „UW-Wert, Ertüchtigung\")"}, {"nr": "4.07", "thema": "UCW-Wert von Vorhangfassaden", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Vorhangfassaden im Sinne des GEG sind nach DIN EN ISO 12631: 2018-01 beschriebene Pfosten-Riegel-Fassaden oder Elementfassaden.\n\nVorhangfassaden werden üblicherweise im Skelettbau als raumumschließende Hülle eingesetzt, indem diese geschossübergreifend und mit allen Funktionen einer Außenwand vor das Traggerüst des Gebäudes gehängt werden. Im Unterschied zu lastabtragenden Außenwänden tragen Vorhangfassaden nur ihr Eigengewicht. Vorhangfassaden können etwa durchgehende Glasfassaden sein oder zusammengesetzt aus Pfosten und Riegeln mit transparenten (z. B. Fenstern bzw. Verglasungen) und opaken Ausfachungen (z. B. Paneelen).\n\nGemäß DIN V 4108-4 darf der vom Hersteller nach DIN EN 13830 deklarierte Wärmedurchgangskoeffizient (UCW) einer Vorhangfassade als Bemessungswert verwendet werden. DIN EN 13830 beschreibt Verfahren zur Ermittlung von UCW. Im UCW-Wert werden die transparenten und die opaken Elemente der Vorhangfassade sowie Wärmebrücken aus den Anschlüssen der Elemente innerhalb der Vorhangfassade berücksichtigt.\n\nHinweis: Von einer Vorhangfassade im Sinne des GEG zu unterscheiden ist die vorgehängte hinterlüftete Fassade. Diese stellt als Außenwandbekleidung nach DIN 18516-1 lediglich die äußere Schutzschicht einer mehrschichtig aufgebauten Außenwand dar (siehe auch TFAQ 3.06 „U-Wert von Bauteilen mit stark belüfteten Luftschichten\")."}, {"nr": "4.08", "thema": "UW-Wert von Fenstern, äquivalenter U-Wert", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Im Rahmen des GEG sowie von geförderten Einzelmaßnahmen ist der äquivalente UW,eq-Wert als Nachweiswert nicht zulässig.\n\nDer äquivalente UW,eq-Wert eines Fensters berücksichtigt zusätzlich potenzielle solare Gewinne über die Verglasung in Abhängigkeit vom Gesamtenergiedurchlassgrad g der Verglasung bei Standardausrichtung.\n\nFür den UW-Wert als Nachweiswert siehe TFAQ 4.02 „UW-Wert von senkrecht eingebauten Fenstern und Fenstertüren\"."}, {"nr": "4.09", "thema": "Glasdächer, Lichtbänder und Lichtkuppeln, Definition", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Eine Definition zur Unterscheidung transparenter Bauteile im Dachbereich enthält Antwort 1 in der Auslegung zu Anlage 1 bis 3 und 7 GEG 2020 (Definition transparenter Bauteile im Dachbereich). Es heißt hier:\n\nIm Sinne von Anlage 1 bis 3 GEG 2020 sind\n• \"Lichtbänder\" diejenigen Teilflächen der wärmeübertragenden Umfassungsfläche des Gebäudes, die von Dachlichtbändern aus Kunststoff nach DIN EN 14963: 2006-12 gebildet werden;\n• \"Lichtkuppeln\" diejenigen Teilflächen der wärmeübertragenden Umfassungsfläche des Gebäudes, die von Lichtkuppeln nach DIN EN 1873: 2006-03 gebildet werden;\n• \"Glasdächer\" die übrigen transparenten Dachflächen eines Gebäudes mit Ausnahme von Dachflächenfenstern.\n\n(siehe auch TFAQ 4.10 „U-Wert Lichtkuppel\")"}, {"nr": "4.10", "thema": "U-Wert Lichtkuppel", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Für Lichtkuppeln ist der U-Wert gemäß DIN 4108-4: 2017-03 Abschnitt 6.1 nach der Produktnorm DIN EN 1873 zu bestimmen.\n\n(siehe auch TFAQ 4.09 „Glasdächer, Lichtbänder und Lichtkuppeln, Definition\")"}, {"nr": "4.11", "thema": "U-Wert von geneigt eingebauten transparenten Bauteilen (Dachflächenfenster, Glasdächer)", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, transparente Bauteile", "beschreibung": "Für Dachflächenfenster kann der vom Hersteller für das Fenster deklarierte Messwert nach DIN EN ISO 12567 verwendet werden.\n\nDer U-Wert für Glasdächer ist nach DIN EN ISO 10077-1 zu ermitteln.\n\nFür den Wärmedurchgangskoeffizient Ug der Verglasung muss ein nach EN 673, ggf. unter Berücksichtigung der geneigten Einbaulage, berechneter oder ein nach EN 674 bzw. EN 675 gemessener Wert herangezogen werden.\n\n(siehe auch TFAQ 4.09 „Glasdächer, Lichtbänder und Lichtkuppeln, Definition\")"}, {"nr": "5.01", "thema": "UD-Wert von Türen", "relevanz": "WG, NWG", "section": "Bauteile der Gebäudehülle, Türen und Tore", "beschreibung": "Der UD-Wert einer Tür wird ähnlich wie der UW-Wert für Fenster bestimmt (siehe TFAQ 4.02 „UW-Wert von senkrecht eingebauten Fenstern und Fenstertüren\").\n\nGemäß DIN V 4108-4 darf der vom Hersteller nach DIN EN 14351-1 für eine Tür mit Standardgröße (1,23 m x 2,18 m bzw. für Größen > 3,6 m² 2,00 m x 2,18 m) und mit gleicher Bauart deklarierte UD-Wert verwendet werden.\n\nIn der Produktnorm DIN EN 14351-1 sind die Verfahren zur Bestimmung von UD für Türen festgelegt. Danach ist UD nach DIN EN ISO 10077-1 zu ermitteln oder nach DIN EN ISO 12567 zu messen.\n\nAuch bei einer Ermittlung nach DIN EN ISO 10077-1 ist gemäß DIN V 4108-4 ausreichend, wenn UD für die in DIN EN 14351-1 festgelegten Standardgrößen ermittelt wird. Grundsätzlich darf der UD-Wert anhand der tatsächlichen Türgröße ermittelt werden."}, {"nr": "5.02", "thema": "U-Wert von Toren", "relevanz": "NWG", "section": "Bauteile der Gebäudehülle, Türen und Tore", "beschreibung": "Gemäß DIN V 4108-4 wird der UD-Wert für Tore nach DIN EN 13241 ermittelt und mit dem CE-Zeichen angegeben.\n\nGemäß der Produktnorm DIN EN 13241 muss der U-Wert für Tore nach EN 12428 und Anhang B der DIN EN 13241 geprüft oder berechnet werden."}, {"nr": "6.01", "thema": "Innenbeleuchtung, technische Mindestanforderungen", "relevanz": "NWG", "section": "Innenbeleuchtung, Nichtwohngebäude", "beschreibung": "In der BEG EM wird der Einbau fest installierter, energieeffizienter Innenbeleuchtungssysteme bei Nichtwohngebäuden gefördert, soweit die zu beleuchtenden Gebäudebereiche sowie die Art der Beleuchtungssysteme in den Anwendungsbereich des GEG fallen. Die Beleuchtungssysteme müssen somit der Erfüllung der Sehaufgabe innerhalb von Gebäuden dienen. Nach DIN V 18599 Teil 4 betrifft die Sehaufgabe die „sehrelevanten Elemente der auszuführenden Arbeit\".\n\nNicht in den Anwendungsbereich des GEG fallen beispielsweise Sicherheits- und Fluchtwegbeleuchtungen, Warenausleuchtungen, Beleuchtungssysteme an Vordächern bzw. außerhalb des Gebäudes sowie Beleuchtungssysteme in unbeheizten Zonen. Zudem können Beleuchtungssysteme, die ausschließlich einem Produktionsprozess dienen (z. B. zur Aufzucht von Pflanzen) nicht mitgefördert werden.\n\nDie Anforderungen beim Umbau bestehender Beleuchtungssysteme auf eine energieeffiziente Beleuchtungstechnik stellen Mindestanforderungen dar und müssen für die Förderung als Einzelmaßnahme von jeder einzelnen Leuchte erreicht werden. Eine Mischrechnung ist zum Nachweis der Erfüllung der Anforderung nicht zulässig."}, {"nr": "6.02", "thema": "Leuchten-Lichtausbeute", "relevanz": "NWG", "section": "Innenbeleuchtung, Nichtwohngebäude", "beschreibung": "Die Leuchten-Lichtausbeute (Systemlichtausbeute des eingebauten Leuchtmittels mit Betriebsgerät) kennzeichnet die Effizienz einer kompletten Leuchte bzw. des gesamten Systems aus Leuchte, inklusive Reflektor und Leuchtmittel."}, {"nr": "7.01", "thema": "Lüftungsanlagen WG, technische Mindestanforderungen", "relevanz": "WG", "section": "Anlagentechnik (außer Heizung)", "beschreibung": "Die Werte für Wärmebereitstellungsgrad ηWBG in % und die spezifische elektrische Leistungsaufnahme Pel,Vent in W/(m³/h) sind der bauaufsichtlichen Zulassung des DIBt (Deutsches Institut für Bautechnik) zu entnehmen.\n\nDie o.g. Anforderungen werden gleichwertig erfüllt, wenn die Lüftungsanlage einen spezifischen Energieverbrauch von SEV < -26 kWh/(m²a) gemäß Ökodesign-Richtlinie 1253/2014 aufweist. Dies entspricht der SEV-Klasse B bei durchschnittlichem Klima."}, {"nr": "7.02", "thema": "Kompakt-Geräte, ETAs-Werte", "relevanz": "WG", "section": "Anlagentechnik (außer Heizung)", "beschreibung": "Kompakt-Geräte mit Luft/Luft-Wärmeübertrager und mit Abluftwärmepumpe sind förderfähig, sofern diese ETAs-Werte von mindestens 140 % erreichen. In Anlehnung an die Verordnung (EU) Nummer 813/2013 ist diese Anforderung bei durchschnittlichen Klimaverhältnissen (Referenzstandort ist Straßburg) und Niedertemperatur-Anwendung (35 °C) zu erfüllen. Davon abweichend gilt bei luftheizenden Wärmepumpen eine Raumlufttemperatur von 20 °C als Bezugs-Bedingung. Zwar werden die genannten Geräte derzeit nicht über die Ökodesign-Richtlinie abgebildet. Dennoch können ETAs-Werte mit hinreichender Genauigkeit anhand geprüfter oder berechneter Werte über die Berechnungsmethodik der EN 14825 bestimmt werden. Fehlende Werte dürfen durch Interpolation und/oder Extrapolation bestimmt werden.\n\n(siehe auch TFAQ 8.24 „Wärmepumpen - Beratung zum Einsatz zukunftssicherer Kältemittel\")"}, {"nr": "7.03", "thema": "Lüftungsanlagen, Prüfungen/Nachweise", "relevanz": "WG, NWG", "section": "Anlagentechnik (außer Heizung)", "beschreibung": "Bei Erneuerung oder Erstinstallation raumlufttechnischer Anlagen sind die planmäßigen Luftvolumenströme der raumlufttechnischen Anlagen einzustellen. Über die Einstellung der Sollwerte ist ein messtechnischer Nachweis nach EN 12599 (Einregulierungsprotokoll) zu erbringen.\n\nFür Nichtwohngebäude ist nachzuweisen, dass die Dichtheitsklasse B als Voraussetzung für die Energieeffizienz der Anlagen eingehalten wird. Die Prüfung der Dichtigkeit des Kanalsystems erfolgt nach EN 12599. Bei Anlagen mit komplexen Luftleitungssystemen kann die Prüfung abschnittsweise erfolgen und dabei auf die Hauptleitungen beschränkt werden."}, {"nr": "7.04", "thema": "ETAs,c – Berechnung aus SEER", "relevanz": "", "section": "Anlagentechnik (außer Heizung)", "beschreibung": "Der in den technischen Mindestanforderungen vorgegebene Mindest-Raumkühlungs-Jahresnutzungsgrad (ηs,c) muss aufgrund von Herstellerangaben nachgewiesen werden können. Liegt nur der SEER-Wert des Kälteerzeugers vor, erfolgt die ηs,c-Berechnung nach folgender Formel:\n\nETAs,c = [SEER × 1/CC – F(1) – F(2)] × 100\n\nDabei ist:\n• ETAs,c: jahreszeitbedingte Raumkühlungs-Energieeffizienz (ηs,c) gemäß Verordnung (EU) Nummer 2016/2281 [in %]\n• SEER: Bezugswert der saisonalen Arbeitszahl im Kühlbetrieb gemäß EN 14825 [in kWh/kWh]\n• CC: Umwandlungskoeffizient in Höhe von 2,5 gemäß Verordnung (EU) Nummer 2016/2281 zur Berücksichtigung des durchschnittlichen Wirkungsgrads der Stromerzeugung in der EU\n• F(1): Korrekturwert in Höhe von 0,03 gemäß Verordnung (EU) Nummer 2016/2281 und EN 14825 zur Berücksichtigung des Hilfsstromverbrauchs von Temperaturreglern\n• F(2): nur bei Wasser/ Sole-Wasser-Komfortkühlern und Wasser/Sole-Luft-Raumklimageräten: Korrekturwert in Höhe von 0,05 gemäß Verordnung (EU) Nummer 2016/2281 und EN 14825 zur Berücksichtigung des Stromverbrauchs der Grundwasser-/Solepumpe(n)"}, {"nr": "8.01", "thema": "Energieverbräuche und Wärmemengen messen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Energieverbräuche sowie alle erzeugten Wärmemengen eines förderfähigen Wärmeerzeugers müssen durch Bilanzierungs-/Messtechnik erfasst werden. Beim Einsatz von Wärmepumpen gehören dazu auch die benötigten Hilfsstrommengen zum Betrieb von Elektro-Heizstäben und Pumpen zur Erschließung von Wärmequellen.\n\nEbenfalls zu erfassen sind die erzeugten Wärmemengen.\n\nHinsichtlich der Ausgestaltung und der Genauigkeit der eingesetzten Bilanzierungs-/Messtechnik bestehen keine Anforderungen. Eingesetzte technische Komponenten müssen nicht geeicht sein. Neben externen Brennstoff-/Strommengenzählern und Wärmemengenzählern sind auch geräteintegrierte Bilanzierungen über die Regelung eines Wärmerzeugers zulässig.\n\nAusnahmen:\n• Bei förderfähigen Biomasseheizungen müssen lediglich die erzeugten Wärmemengen gemessen werden.\n• Bei förderfähigen Wärmepumpen, die über das Medium Luft heizen, müssen die Wärmemengen gemessen werden. Eine Energieverbrauchsbilanzierung nach DIN/TS 12831-1 (Bestimmung des Wärmeverlustkoeffizienten aus Einzelwerten der Erzeugerleistung und der Außentemperatur) oder DIN V 18599 Beiblatt 1 (Energiesignatur) ist dabei zulässig.\n\nFörderfähige Solarkollektoranlagen müssen mit einem Funktionskontrollgerät (Solarregelung) ausgestattet sein (Luftkollektoren sind ausgenommen). Bei Vakuumröhren- und Vakuumflachkollektoren ab 20 m² oder Flachkollektoren ab 30 m² ist die Erfassung der solaren Erträge im Kollektorkreislauf erforderlich (z.B. mit einem Wärmemengenzähler oder einer Solarregelung mit entsprechender Option)."}, {"nr": "8.02", "thema": "Energieverbrauchs- und Effizienzanzeige", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die gemessenen Energieverbräuche und Wärmemengen eines förderfähigen Wärmeerzeugers können entweder über dessen Display/Nutzerinterface, ein übergeordnetes Energiemanagementsystem, ein externes Gerät oder eine externe Applikation angezeigt werden.\n\nDie Effizienzanzeige ist so auszugestalten, dass Energieverbräuche und erzeugte Wärmemengen mit den Werten vorheriger Heizperioden bzw. vergleichbarer Betriebszeiträume verglichen werden können.\n\nAusnahmen:\n• Bei förderfähigen Biomasseheizungen besteht keine Effizienzanzeigepflicht. Es müssen lediglich die erzeugten Wärmemengen gemessen werden.\n• Bei Biomasseheizungen in Gebäudenetzen müssen lediglich die erzeugten Wärmemengen gemessen werden. Für diese besteht eine Effizienzanzeigepflicht, wenn sie ab dem 1. Januar 2025 beantragt werden. Bei automatisch beschickten (Festbrennstoff-) Biomasseheizungen kann der Brennstoffeinsatz über die mechanische Brennstoffzufuhr näherungsweise erfasst werden, z.B. Fördermenge pro Umdrehung der Förderschnecke. Ist der mittlere Heizwert des Brennstoffs bekannt, kann die Energieeffizienz ermittelt werden. Ohne Kenntnis des Heizwerts kann ein Effizienz-Indikator wie Brennstoffeinsatz pro erzeugte Wärme (kg Holz / kWhth) ermittelt werden. Alternativ kann die Energieeffizienz des Verbrennungsvorgangs aus Abgastemperatur und Sauerstoffgehalt des Abgases abgeleitet werden. Darüber hinaus kann eine Energieverbrauchsbilanzierung (z.B. in DIN/TS 12831-1 Kapitel „Bestimmung des Wärmeverlustkoeffizienten aus Einzelwerten der Erzeugerleistung und der Außentemperatur\", DIN V 18599 Bbl. 1 hier „Energiesignatur\") mit den Werten des Wärmemengenzählers angewendet werden, die nicht direkt die Energieeffizienz ermittelt, aber ebenfalls eine Betriebsüberwachung ermöglicht. (siehe auch „Energiemonitoring und Informationsaustausch bei Geräten und Anlagen (Zählerstudie)\")\n• Bei förderfähigen Wärmepumpen, die über das Medium Luft heizen, müssen die Wärmemengen gemessen werden. Eine Energieverbrauchsbilanzierung nach DIN/TS 12831-1 (Bestimmung des Wärmeverlustkoeffizienten aus Einzelwerten der Erzeugerleistung und der Außentemperatur) oder DIN V 18599 Beiblatt 1 (Energiesignatur) ist alternativ zulässig.\n• Bei förderfähigen Solarkollektoranlagen sind die solaren Erträge und Abweichungen von Erträgen vergangener Zeiträume anzuzeigen.\n• Bei ausschließlichen Wärme- und Gebäudenetzanschlüssen sind keine Energieverbrauchs- oder Effizienzanzeigen notwendig. Diese sind bei der Errichtung, dem Umbau oder der Erweiterung von Gebäudenetzen notwendig.\n\nFür die Überprüfbarkeit des korrekten Betriebs der Anlage wird empfohlen, relevante Betriebsparameter (z. B. Energieverbräuche, erzeugte Wärmemengen, Betriebszustände, Außentemperatur) für mindestens 1 Jahr mit mindestens stündlicher Auflösung (Durchschnittswert) sowie für 10 Jahre mit mindestens monatlicher Auflösung (Durchschnittswert) in einem maschinenlesbaren Format (z. B. csv) vorzuhalten."}, {"nr": "8.03", "thema": "Hydraulischer Abgleich, allgemein", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Für Gebäude mit wassergeführten Heizungssystemen ist bei Erneuerung der Anlagentechnik die Durchführung eines hydraulischen Abgleichs nach Verfahren B stets erforderlich.\n\nDer hydraulische Abgleich ist gemäß dem Formular \"Bestätigung des Hydraulischen Abgleichs u. a. für die BEG Förderung (Einzelmaßnahmen)\" der VdZ - Wirtschaftsvereinigung Gebäude und Energie e. V. durchzuführen und vom durchführenden Fachunternehmen unter Verwendung des Formulars zu bestätigen.\n\nAlternativ kann für Wohngebäude und für Nichtwohngebäuden bis 500 m² beheizter Nettogrundfläche der hydraulische Abgleich gemäß dem Formular „Bestätigung des Hydraulischen Abgleichs BEG - Wohngebäude\" und für Nichtwohngebäude gemäß dem Formular Nichtwohngebäude \"Bestätigung des Hydraulischen Abgleichs von wasserführenden Heizsystemen für die BEG Förderung\" der VdZ - Wirtschaftsvereinigung Gebäude und Energie e. V. durchgeführt werden.\n\nDas Verfahren zum hydraulischen Abgleich muss der Leistungsbeschreibung der VdZ-Formulare entsprechen. Die Leistungsbeschreibung des VdZ-Formulars enthält Anforderungen an Zweirohrheizungen mit Heizflächen, Einrohrheizungen mit Heizflächen sowie an Fußbodenheizungen.\n\nDer Einbau von Systemen auf Basis temperaturbasierter Verfahren des hydraulischen Abgleichs ist grundsätzlich förderfähig. Systeme zum temperaturbasierten hydraulischen Abgleich zielen oft auf einen ausschließlichen Abgleich der Übergabeeinrichtung ab. Der Einsatz von Systemen zum temperaturbasierten Abgleich ersetzt demnach nicht die Einhaltung der Anforderungen an den hydraulischen Abgleich gemäß der o.g. Leistungsbeschreibungen der „VdZ-Formulare\". Eine Gleichwertigkeit zum Verfahren B liegt dann vor, wenn die in der Checkliste „Anforderungen zur Anerkennung der Gleichwertigkeit mit dem Verfahren B in der BEG\" genannten Anforderungen an die Zertifizierung und an das Verfahren erfüllt und umgesetzt sind.\n\nFormulare, Fachregel und Leitfaden sowie weitere Informationen zum hydraulischen Abgleich sind auch hier zu finden: https://www.vdzev.de/service/formulare-hydraulischer-abgleich/\nDie VdZ-Formulare sind ebenso hier zu finden: www.kfw.de/eee.\n\nWurde
