 in der Vergangenheit bereits ein hydraulischer Abgleich nach Verfahren B durchgeführt, ist die Verwendung vorhandener Berechnungen und Auslegungen möglich. Die Berechnungen sind jedoch auf Aktualität (z.B. Änderungen der Gebäudegeometrie oder des baulichen Wärmeschutzes) zu überprüfen sowie ggf. anzupassen. Ggf. notwendige bauliche Anpassungen und Anpassungen an den Einstellungen an der Anlage sind durchzuführen.\n\nBei Installation oder Erneuerung einer technischen Anlage zur ausschließlichen Trinkwarmwasserbereitung, wie beispielsweise einer solarthermischen Anlage zur Trinkwarmwasserbereitung, ist kein hydraulischer Abgleich des Heizungssystems erforderlich."}, {"nr": "8.04", "thema": "Hydraulischer Abgleich, luftheizende Systeme", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Bei luftgeführten Wärmepumpen und anderen luft-heizenden Systemen ist kein hydraulischer Abgleich möglich. Dort wird der hydraulische Abgleich durch den Abgleich bzw. die Einregulierung der Luftvolumenströme ersetzt. Davon ausgenommen sind Außenluft-Raumluft-Wärmepumpen (Luft-Luft-Wärmepumpen), die Sekundärluftgeräte als Inneneinheit verwenden. In der Fachunternehmererklärung ist zu bestätigen, dass die Luftvolumenströme gemäß den rechnerisch ermittelten Einstellwerten einreguliert wurden."}, {"nr": "8.05", "thema": "Ermittlung der Gebäudeheizlast", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Zur korrekten Auslegung einer Heizungsanlage (Vermeidung von über- oder unterdimensionierten Anlagen) ist die Dimensionierung der Anlage anhand einer Gebäude-Heizlastermittlung nach den Normen DIN EN 12831-1 und DIN/TS 12831-1 durchzuführen. Grundsätzlich kann immer das ausführliche Verfahren bzw. das Standardverfahren nach dieser Normenreihe angewendet werden. Dabei können Vereinfachungen vorgenommen werden:\n• Bauteilflächen sind nur zu berücksichtigen, wenn im Auslegungsfall eine Temperaturdifferenz von mehr als 4 Kelvin zwischen dem betrachteten Bereich und der benachbarten Umgebung vorhanden ist.\n• U-Werte der Bestands-Außenbauteile können nach Typologie angesetzt werden (siehe TFAQ „3.02 Bekanntmachung, fehlende Kennwerte für Bauteile\"). Diese U-Werte sind ebenfalls in den Normen DIN EN 12831-1 und DIN/TS 12831-1 aufgeführt.\n\nDie in den Normen beschriebenen geometrische Vereinfachungen (wie z.B. „Bauteilflächenermittlung über die Raumfläche\") können nicht angewendet werden.\n\nIm Zuge der Durchführung des hydraulischen Abgleichs nach Verfahren B ist eine raumweise Heizlastberechnung nach den Normen DIN EN 12831-1 und DIN/TS 12831-1 erforderlich (siehe TFAQ 8.03 „Hydraulischer Abgleich\"). Diese Berechnungen können für die Ermittlung der Gebäudeheizlast herangezogen werden."}, {"nr": "8.06", "thema": "Verbindung der Heizungsanlage mit dem Internet", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Grundsätzlich besteht eine Verpflichtung einen geförderten Wärmeerzeuger an das Internet anzuschließen. In folgenden Fällen kann davon abgewichen werden:\n• Es besteht keine technische Schnittstelle am Wärmeerzeuger (kabelgebunden oder kabellos)\n• Der Antragsteller und/oder der Anlagenbetreiber haben keinen eigenen Internetanschluss/-vertrag im Aufstellgebäude des Wärmeerzeugers (z. B. Mietshaus, Telefonvertrag ohne Internet) oder der Wärmeerzeuger ist außerhalb des Gebäudes aufgestellt (z. B. Gebäudenetz)\n• Für die Herstellung einer Verbindung mit dem Internet ist eine Verlegung von Netzwerkkabeln durch nicht vom Antragsteller und/oder Anlagenbetreiber bewohnte Räume notwendig. Gleichzeitig ist der Aufstellort des Wärmeerzeugers nicht durch ein WLAN-Signal erreichbar (Beispiel: abgeschirmte Räume oder externe Störfrequenzen). Eine mobile Datenverbindung muss nicht genutzt werden."}, {"nr": "8.07", "thema": "Vermeidung von über- oder unterdimensionierten Anlagen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Zur korrekten Auslegung einer Heizungsanlage (Vermeidung von über- oder unterdimensionierten Anlagen) ist die Dimensionierung der Anlage anhand einer Heizlastermittlung nach den Normen DIN EN 12831-1 und DIN/TS 12831-1 durchzuführen.\n\nEin Wärmeerzeuger, der den gesamten Wärmebedarf des Gebäudes (oder mehrerer Gebäude) allein decken kann (monovalente Betriebsweise, z.B. durch einen Heizkessel oder eine Wärmeübergabestation), muss im Auslegungsfall, d.h. bei Normaußentemperatur am entsprechenden Standort, ebenfalls die Gebäudeheizlast sowie die Leistungsanforderung der Trinkwarmwasserbereitung vollständig decken können.\n\nIm Falle der Installation einer Wärmepumpe mit elektrischer Nachheizung (monoenergetisch) und bivalent-paralleler Betriebsweise muss die thermische Leistung der Wärmepumpe im Auslegungsfall die Gebäudeheizlast nicht vollständig decken können. Ab dem Bivalenzpunkt, bzw. der Bivalenztemperatur wird die Gebäudeheizlast von der Wärmepumpe sowie der elektrischen Nachheizung gedeckt. Die Ermittlung des Bivalenzpunkts ist Bestandteil der Auslegung einer Wärmepumpe und geht in die Berechnung der Jahresarbeitszahl ein (siehe auch TFAQ 8.18 „Wärmepumpen – Jahresarbeitszahl (JAZ)\").\n\nGrundsätzlich wird innerhalb der BEG von einer fachgerechten Planung und Auslegung eines Wärmeerzeugers ausgegangen."}, {"nr": "8.08", "thema": "65 %-EE-Anteil, allgemein", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Der Wärmebedarf muss bei Errichtung oder Erweiterung von Heizungsanlagen in Gebäuden zu einem Mindestanteil von 65 % durch die Nutzung erneuerbarer Energien oder unvermeidbarer Abwärme gedeckt werden.\n\nDer Mindestanteil von 65 % Erneuerbare Energien und/oder unvermeidbare Abwärme kann durch bereits bestehende oder im Rahmen der Förderung neu eingebaute Anlagen oder durch eine Kombination aus beiden erreicht werden. Dabei sind die geforderten 65 % ausschließlich für den zu sanierenden Versorgungsbereich, d.h. für die zu sanierenden Flächen bzw. Wohneinheiten und/oder für die zu sanierende Trinkwarmwasserbereitung nachzuweisen. Dies kann auch ein einzelner Raum innerhalb einer Wohn- oder Gewerbeeinheit sein.\n\nDer Nachweis zur Einhaltung der Anforderung kann über pauschale Erfüllungsoptionen ohne Berechnung des Deckungsanteils erbracht werden (siehe TFAQ 8.09 „65 %-EE-Anteil, Nachweis über Erfüllungsoptionen\").\n\nAlternativ kann der Nachweis auf Grundlage einer Berechnung des Deckungsanteils nach DIN V 18599: 2018-09 erfolgen (siehe TFAQ 8.10 „65 %-EE-Anteil, Einzelnachweis\").\n\nAusnahme: Die Anforderung des Mindestanteil von 65 % Erneuerbare Energien und/oder unvermeidbare Abwärme muss bei der ausschließlichen Errichtung einer Solarthermie-Anlage nicht eingehalten werden."}, {"nr": "8.09", "thema": "65 %-EE-Anteil, Nachweis über Erfüllungsoptionen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Anforderung an den 65 %-EE-Anteil gilt für die folgenden förderfähigen Anlagen pauschal als erfüllt, wenn sie einzeln oder in Kombination miteinander den Wärmebedarf des Gebäudes oder des Gebäudenetzes vollständig decken:\n• Hydraulisch eingebundene Heizungsanlagen zur Nutzung von Biomasse\n• Elektrisch angetriebene Wärmepumpen\n• Innovative Heiztechnik\n\nFolgende Erzeuger dürfen zusätzlich als Erfüllungsoption angerechnet werden:\n• Stromdirektheizungen, sofern Anrechnung nach GEG zulässig\n• Elektronisch geregelte Durchlauferhitzer bei dezentraler Trinkwarmwasserbereitung\n• Solarthermische Anlagen\n\nBei Anschluss eines Gebäudes an ein bestehendes Gebäudenetz muss dessen Wärmeerzeugung zu mind. 25 % durch erneuerbare Energien und/oder Abwärme erfolgen.\n\nBei Errichtung, Umbau und Erweiterung eines Gebäudenetzes muss dessen Wärmeerzeugung zu mind. 65 % durch erneuerbare Energien und/oder Abwärme erfolgen.\n\nBei Anschluss eines Gebäudes an ein Wärmenetz sind keine Mindestanforderungen an den EE-Anteil einzuhalten."}, {"nr": "8.10", "thema": "65 %-EE-Anteil, Einzelnachweis", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Der Deckungsanteil kann über einen rechnerischen Einzelnachweis nach DIN V 18599 ermittelt werden.\n\nHierbei ist die Erzeugernutzwärmeabgabe für Heizung und/oder Trinkwarmwasserbereitung der einzelnen regenerativen Erzeuger der Summe der Erzeugernutzwärmeabgaben aller Erzeuger gegenüberzustellen.\n\nEinzelfeuerstätten, die ausschließlich mit Biomasse betrieben werden, können bei der Ermittlung des Deckungsanteils nach DIN V 18599-5: 2018-09 Abschnitt 6.5.6 berücksichtigt werden."}, {"nr": "8.11", "thema": "Klimageschwindigkeits-Bonus, Kombinationspflicht bei Biomasseheizung", "relevanz": "WG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Entsprechend der Förderrichtlinie BEG EM wird der Klimageschwindigkeits-Bonus für selbstnutzende Eigentümer von Wohngebäuden für den Austausch von bestimmten funktionstüchtigen Wärmeerzeugern (wie Öl-, Kohle-, Gas-Etagen- und Nachtspeicherheizungen bzw. bestimmte Gas- und Biomasseheizungen) gewährt.\n\nBeim Einbau eines förderfähigen Biomasse-Wärmeerzeugers kann der Klimageschwindigkeits-Bonus nur gewährt werden, wenn dieser mit einer\n• solarthermischen Anlage oder\n• Anlage zur Erzeugung von Strom aus solarer Strahlungsenergie mit direkt elektrischer Warmwasserbereitung oder\n• Wärmepumpe zur Warmwasserbereitung und/oder Raumheizungsunterstützung\nkombiniert wird. Die Nutzung bzw. Anrechnung von bereits bestehenden Anlagen ist möglich. Die ergänzenden Anlagen sind so zu dimensionieren, dass sie (einzeln oder in Summe) mindestens den Warmwasserbedarf des durch den neu eingebauten Biomassewärmeerzeuger versorgten Bereichs außerhalb der Heizperiode (Mai bis September) decken können. Der rechnerische Nachweis kann auf Basis einer Energiebilanz nach DIN V 18599 erfolgen. Hierbei ist es ausreichend, wenn nachgewiesen wird, dass im ertragsschwächsten Monat September das ergänzende Warmwasser-System mindestens die Wärmemenge liefert, die zur Warmwasserbereitstellung erforderlich ist.\n\nVereinfachend ist die Anforderung erfüllt, wenn\n• bei Solarthermie-Anlagen mindestens eine Fläche von 0,04 Quadratmetern Aperturfläche je Quadratmeter Nutzfläche installiert und betrieben wird. Diese Anforderung gilt ebenfalls als erfüllt, wenn der Bruttowärmeertrag des Kollektorfeldes (GTYFeld) in Kilowattstunden bei 50 °C am Standort Würzburg nach Solar Keymark Datenblatt mindestens das 20-fache der Nutzfläche beträgt.\n• bei einer Anlage zur Erzeugung von Strom aus solarer Strahlungsenergie und direktelektrischer Warmwasserbereitung mindestens eine Modulfläche von 0,25 Quadratmeter je Quadratmeter Nutzfläche installiert und betrieben wird. Diese Anforderung gilt ebenfalls als erfüllt, wenn die Nennleistung in Kilowatt mindestens das 0,05-fache der Nutzfläche beträgt.\nBei Anlagen zur Erzeugung von Strom aus solarer Strahlungsenergie zur elektrischen Wärmeerzeugung muss der Strom aus solarer Strahlungsenergie vorrangig und direkt der elektrischen Wärmeerzeugung (Heizung, Warmwasser) zugeführt werden. Die Anrechnung vom ins öffentliche Netz eingespeisten Strom ist nicht möglich.\n• eine ergänzende Wärmepumpe mit einer thermischen Leistung von 0,015 kW je Quadratmeter Nutzfläche installiert wird. Alternativ ist die Anforderung ebenfalls erfüllt, wenn die Brauchwasserwärmepumpe über ein Speichervolumen von mindestens 140 Litern pro Wohneinheit, jedoch mindestens 200 Litern Gesamtvolumen, verfügt."}, {"nr": "8.12", "thema": "Klimageschwindigkeits-Bonus, Hybridheizungen", "relevanz": "WG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Bedingung für den Klimageschwindigkeits-Bonus ist stets der Austausch eines funktionstüchtigen Wärmeerzeugers nach den Vorgaben von Nummer 8.4.4 der Richtlinie.\n\nBei der Beantragung des Klimageschwindigkeits-Bonus für förderfähige Wärmeerzeuger im Hybridbetrieb, bei denen die Spitzenlast durch einen separaten gasbetriebenen Erzeuger abgedeckt wird, muss der Spitzenlastkessel entweder mit 100 % grünem oder blauem Wasserstoff betrieben werden oder auf den Betrieb mit 100 % Wasserstoff umrüstbar sein und gleichzeitig die Anforderungen nach § 71k GEG erfüllen (siehe auch TFAQ 8.26 „Wasserstofffähige Heizung\").\n\nAlternativ kann der Klimageschwindigkeits-Bonus auch dann gewährt werden, wenn der Wärmebedarf des zu sanierenden Versorgungsbereichs nach Umsetzung der Maßnahme vollständig durch Erneuerbare Energien und/oder unvermeidbarer Abwärme gedeckt wird. Dies bedeutet z. B. für einen gasbetriebenen Spitzenlastkessel, dass dieser zu 100 % mit Biomethan betrieben werden muss (siehe auch TFAQ 8.37 „Nachweis grüner oder blauer Wasserstoff bzw. Biomethan\").\n\nWerden die oben genannten Anforderungen an den Spitzenlasterzeuger nicht erfüllt, so wird der Kostenanteil des EE-Erzeugers ohne Gewährung des Klimageschwindigkeits-Bonus gefördert. Bei Kompaktgeräten ist ein Kostenanteil von 65 % anzusetzen."}, {"nr": "8.13", "thema": "65 % EE-Anteil bei Biomasseanlagen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Einhaltung der 65-Prozent-Pflicht wird grundsätzlich als erfüllt angesehen, wenn bei vorrangig bivalent-parallelem oder bivalent teilparallelem Betrieb die Leistung der Biomasseheizung mindestens 30 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 30 % der Norm-Heizlast des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt und bei bivalent alternativem Betrieb die Leistung der Biomasseheizung mindestens 40 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 40 % der Norm-Heizlast des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt."}, {"nr": "8.14", "thema": "65 % EE-Anteil bei Wärmepumpen - Anforderung", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Bei der Errichtung von sowie der Nachrüstung mit Wärmepumpen zur Raumheizung inkl. der Nachrüstung bivalenter Systeme müssen die durch die Anlagen versorgten Wohneinheiten oder Flächen bzw. des versorgten Gebäudeteils nach Durchführung der Maßnahme zu mindestens 65 % durch erneuerbare Energien beheizt werden.\n\nBei Wärmepumpen-Hybridheizungen erfolgt die Bilanzierung des EE-Anteils nach DIN V 18599. Maßgeblich für den EE-Anteil von 65 % ist die über die Dauer einer Heizperiode benötigte Energiemenge und nicht die Leistung der Anlage. Die durch bestehende Wärmeerzeuger bereitgestellten Wärmemengen (erneuerbare und nicht erneuerbare Energien) sind zu berücksichtigen.\n\nDie Einhaltung der 65-Prozent-Pflicht wird grundsätzlich als erfüllt angesehen, wenn nach § 71 h GEG die einzelnen Wärmeerzeuger der Wärmepumpen-Hybridheizung über eine gemeinsame, fernansprechbare Steuerung verfügen und bei\n• vorrangig bivalent-parallelem oder bivalent teilparallelem Betrieb die Leistung der Wärmepumpe mindestens 30 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 30 % der Norm-Heizlast inkl. Trinkwarmwasserbereitung gemäß TFAQ 8.07 „Vermeidung von über- oder unterdimensionierten Anlagen\" des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt.\n• bivalent alternativem Betrieb die Leistung der Wärmepumpe mindestens 40 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 40 % der Norm-Heizlast inkl. Trinkwarmwasserbereitung gemäß TFAQ 8.07 des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt.\n\nFür Wärmepumpen ist die Leistungsangabe der Heizleistung am Teillastpunkt „A\" (Tj = -7 °C) nach Verordnung (EU) Nummer 813/2013 bzw. DIN EN 14825 im Klima „gemäßigt\" maßgebend.\n\nWird der Spitzenlasterzeuger mit gasförmigen oder flüssigen Brennstoffen betrieben, darf diese vereinfachte Regelung nur angewendet werden, wenn es sich um einen Brennwertkessel handelt."}, {"nr": "8.15", "thema": "Solarkollektoranlagen - Mindestkollektorfläche / Mindestspeichervolumen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Förderfähigkeit einer Solarkollektoranlage ist nicht abhängig von der Einhaltung einer Mindestkollektorfläche und eines Mindestspeichervolumens.\n\nAuch muss bei einer ausschließlichen Umsetzung einer Solarthermie-Anlage nicht die Anforderung der Förderrichtlinie erfüllt werden, dass die durch die Anlagen versorgten Wohneinheiten oder Flächen nach Durchführung der Maßnahme zu mindestens 65 % durch erneuerbare Energien beheizt werden."}, {"nr": "8.16", "thema": "Biomasseheizungen - Prüfnachweise zur Förderung und Listung beim BAFA", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Um förderfähig zu sein, sind folgende Prüfnachweise erforderlich:\n\nBei Biomasseanlagen zur Verfeuerung fester Biomasse bis zu einer Nennwärmeleistung von 500 kW muss ein vollständiger Prüfbericht über eine heiztechnische Prüfung nach EN 303-5 eines nach ISO 17025 akkreditierten Prüfinstituts vorliegen und auf Nachfrage ggf. eingereicht werden.\n\nBei Biomasseanlagen mit einer Nennwärmeleistung von mehr als 500 kW und weniger als 1.000 kW muss ein Prüfbericht eines nach ISO 17025 akkreditierten Prüfinstituts über eine heiztechnische Prüfung in Anlehnung an die EN 303-5 vorliegen und auf Nachfrage ggf. vorgelegt werden.\n\nBei Biomasseanlagen mit einer Nennwärmeleistung von mehr 1.000 kW muss per Prüfprotokoll eines unabhängigen Instituts über eine Vorortmessung nachgewiesen werden, dass die Vorgaben gemäß BEG EM Nummer 3.3 eingehalten werden (Einzelabnahme).\n\nBei Pelletöfen mit Wassertasche muss ein vollständiger Prüfbericht eines nach ISO 17025 akkreditierten Prüfinstituts über eine heiztechnische Prüfung (Prüfbericht) nach EN 16510-2-6:2022 vorliegen und auf Nachfrage ggf. vorgelegt werden.\n\nDie Anforderungen gelten als erfüllt, wenn die Biomasseanlage mit bis zu 1.000 kW Nennwärmeleistung im Wärmeerzeugerportal als förderfähig gelistet ist.\n\nBiomasseanlagen mit mehr als 1.000 kW Nennwärmeleistung müssen ebenfalls als förderfähig gelistet sein. Zum Verwendungsnachweis/ (g)BnD muss das Prüfprotokoll der Einzelabnahme dem Antragsteller vorliegen, welches die Erfüllung der oben genannten Anforderungen bescheinigt."}, {"nr": "8.17", "thema": "Wärmepumpen - Prüfnachweise zur Förderung und Listung beim BAFA", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Um förderfähig zu sein, sind folgende Prüfnachweise erforderlich:\n\nBei elektrisch angetriebenen Wärmepumpen muss eine Einzelprüfung nach DIN EN 14511/ DIN EN 14825 oder eine Zertifizierung durch ein nach ISO 17025 akkreditiertes Prüfinstitut vorliegen und auf Nachfrage ggf. vorgelegt werden. Dies gilt für alle Wärmepumpen mit der Wärmequelle Luft und einer Wärmeleistung bis einschließlich 50 kW sowie alle weiteren Wärmepumpen mit einer Wärmeleistung bis einschließlich 100 kW (Erdwärme, Wasser, sonstige Wärmequellen), die nach normierten Verfahren geprüft werden können.\n\nBei Wärmepumpen, deren Wärmeleistung die oben genannten Grenzen überschreiten und/oder nicht nach normierten Verfahren geprüft werden können, kann die Förderfähigkeit alternativ auch auf Basis von Herstellernachweisen nachgewiesen werden.\n\nDie Anforderungen gelten als erfüllt, wenn der Erzeuger im Wärmeerzeugerportal als förderfähig gelistet ist. Ausnahme: Bei Luft-Luft-Wärmepumpen muss das Außengerät gelistet sein und zusätzlich müssen die Anforderungen in Kombination mit dem/den Innengerät(en) eingehalten werden, welche in der TFAQ 8.21 „Wärmepumpen - Luft/Luft-Wärmepumpen Vermeidung von über- oder unterdimensionierten Anlagen\" ersichtlich sind."}, {"nr": "8.18", "thema": "Wärmepumpen - Jahresarbeitszahl (JAZ)", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Jahresarbeitszahl (JAZ) für elektrisch angetriebene Wärmepumpen ist auf Basis von etablierten, den allgemein anerkannten Regeln der Technik entsprechenden Berechnungs- oder Simulationsverfahren zu berechnen. Bei Anwendbarkeit ist das Berechnungsverfahren der VDI 4650 Blatt 1 in der jeweils aktuellen Fassung zu verwenden. Dabei sind die konkreten Randbedingungen vor Ort anzusetzen (z. B. Wärmequellentemperatur, Heizungsvor- und Rücklauftemperatur, etc.).\n\nFür Vorlauftemperaturen bis 60 °C kann die Berechnung nach dem Jahresarbeitszahlenrechner des Bundesverband Wärmepumpe e. V. erfolgen. Dieser basiert auf Basis der VDI 4650 Blatt 1. Monovalente Wärmepumpenanlagen mit Vorlauftemperaturen > 55 °C können ersatzweise als bivalent-alternative Anlagen mit elektrischem Zusatzheizer abgebildet werden.\n\nEin elektrischer Zusatzheizer (direkt-elektrischer Heizstab) ist bei der Ermittlung der Jahresarbeitszahl je nach Betriebsweise, bivalent-parallel oder bivalent-alternativ, in Abhängigkeit von der Gebäudeheizlast bzw. dem Bivalenzpunkt zu berücksichtigen. (siehe auch TFAQ 8.05 „Ermittlung der Gebäudeheizlast\")\n\nBei der Berechnung der JAZ ist darauf zu achten, dass bei kombinierter Wärmeerzeugung für Heizung und Trinkwarmwasser ein passender Trinkwarmwasseranteil am Gesamtnutzwärmebedarf zu berücksichtigen ist. Der JAZ-Rechner des Bundesverband Wärmepumpe e.V. berücksichtigt standardmäßig einen Anteil von 18 %. Dieser kann in Abhängigkeit vom energetischen Standard und Gesamtwärmebedarf des Gebäudes auch höher sein. Sofern eine Gesamtbilanzierung des Gebäudes beispielsweise im Rahmen einer Energieausweiserstellung vorliegt, kann der sich daraus ergebende Trinkwarmwasseranteil verwendet werden. Alternativ kann auf Grundlage von vorliegenden Gesamtverbrauchsdaten der Trinkwarmwasseranteil gemäß Bekanntmachung der Regeln für Energieverbrauchskennwerte im Wohngebäudebestand bzw. Nichtwohngebäudebestand in Anlehnung an die aktuell gültige Heizkostenverordnung der Trinkwarmwasseranteil entweder pauschal angesetzt oder rechnerisch ermittelt werden.\n\nFür Luft-Luft-Wärmepumpen ist die Berechnung einer JAZ für den Nachweis nicht notwendig."}, {"nr": "8.19", "thema": "Wärmepumpen - neue Erdwärmesondenbohrungen; DVGW W 120-2; verschuldensunabhängige Versicherung", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Wärmepumpen mit neu erstellten Erdwärmesondenbohrungen sind förderfähig, wenn zum Zeitpunkt der Bohrung folgende Voraussetzungen erfüllt sind:\n• Die ausführende Bohrfirma ist nach den Qualitätsanforderungen der technischen Regel DVGW W 120-2 zertifiziert.\n• Es besteht ein verschuldensunabhängiger Versicherungsschutz gegen mögliche Sachschäden, die aufgrund der Erdwärmesondenbohrung bei Dritten entstehen.\n\nDie Zertifizierung nach DVGW W 120-2 muss durch eine akkreditierte Zertifizierungsstelle durchgeführt worden sein. Geeignete Zertifizierungsstellen sind in der Datenbank der Deutschen Akkreditierungsstelle (DAkkS) aufgeführt. Der Nachweis einer gültigen Zertifizierung erfolgt durch die Vorlage eines entsprechenden Zertifikats.\n\nAusländische Bohrfirmen, die nicht nach der Technischen Regel DVGW W 120-2 zertifiziert sind, müssen über eine vergleichbare Qualifikation verfügen. Der Nachweis wird in der Regel durch Vorlage der wasserrechtlichen Erlaubnis geführt.\n\nDer Nachweis über das Bestehen eines gültigen verschuldensunabhängigen Versicherungsschutzes erfolgt durch Vorlage einer Versicherungsbescheinigung und eines Zahlungsnachweises. Aus der Versicherungsbescheinigung muss eindeutig hervorgehen, dass\n• die Versicherung zum Zeitpunkt des Bohrvorhabens bestand,\n• die Versicherung das geplante Bohrvorhaben und etwaige Ausgleichsansprüche wegen bohrungsbedingter Schäden in der Nachbarschaft erfasst,\n• der Eigentümer des Grundstücks, auf dem die Bohrung durchgeführt wird, über sie versichert ist (entweder als Versicherungsnehmer oder mitversichert im Rahmen einer durch das Bohrunternehmen abgeschlossenen Versicherung),\n• die Versicherung verschuldensunabhängig ist und die Deckungssumme mindestens 1,0 Mio. € beträgt."}, {"nr": "8.20", "thema": "Wärmepumpen – Wärmepumpenkaskade / Booster-Wärmepumpe / Brauchwasserwärmepumpe", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Anforderung an die Jahresarbeitszahl gilt bei als Kaskade angeordneten Wärmepumpen für jede einzelne Wärmepumpe der Kaskade. Der Nachweis zur Einhaltung der Jahresarbeitszahl ist für jede Wärmepumpe einzeln zu führen.\n\nWenn eine Booster-Wärmepumpe ausschließlich der Trinkwarmwasserbereitung dient, kann sie ohne Einhaltung der Anforderung an die Jahresarbeitszahl mit dem Einbau der förderfähigen Wärmepumpe mitgefördert werden.\n\nMit der Installation eines förderfähigen Wärmeerzeugers oder dem Anschluss an ein Wärme- bzw. Gebäudenetz sind Brauchwasserwärmepumpen mitförderfähig, sofern sie als Wärmequelle keine Raumluft aus thermisch konditionierten Zonen nutzen. Es bestehen hierbei keine weiteren technischen Mindestanforderungen an die Brauchwasserwärmepumpe."}, {"nr": "8.21", "thema": "Wärmepumpen - Luft/Luft-Wärmepumpen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Luft-Luft-Wärmepumpen im Sinne der Förderrichtlinie sind „Anlagen zur Wärmeerzeugung\", sofern sie der Beheizung von Gebäuden dienen. Zu den Luft-Luft-Wärmepumpen zählen auch Split-Klimaanlagen bzw. Klimaanlagen mit Heizfunktion, die beispielsweise zu einem bestehenden Heizsystem nachgerüstet werden. Voraussetzung ist die Einhaltung der gerätetechnischen Mindestanforderungen sowie der Nachweis der Einhaltung von mindestens 65 % EE-Anteil für den zu sanierenden Versorgungsbereich (siehe TFAQ 8.08 „65 %-EE-Anteil, allgemein\"). Bei bivalenter Betriebsweise kann für den versorgten Bereich ein detaillierter Nachweis nach DIN V 18599 geführt werden. Alternativ wird die Einhaltung der 65-Prozent-Pflicht als erfüllt angesehen, wenn bei vorrangig bivalent-parallelem oder bivalent teilparallelem Betrieb die Leistung der Wärmepumpe mindestens 30 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 30 % der Norm-Heizlast des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt und bei bivalent alternativem Betrieb die Leistung der Wärmepumpe mindestens 40 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 40 % der Norm-Heizlast des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt. Eine gemeinsame, fernansprechbare Steuerung gemäß § 71 h GEG wird dabei empfohlen.\n\nEffizienzanforderung an Außen-/Innengerät-Kombinationen mit einer Heizleistung bis einschließlich 12 kW (bei Geräten mit Kühlfunktion: Kühlleistung, siehe EU 206/2012)\n• Single-Split-Geräte\nDie Listung förderfähiger Wärmepumpen im Wärmeerzeugerportal des BAFA enthält Single-Split-Außengeräte, die zertifiziert und förderfähig sind. Da es mit der Kombination von Innengeräten aber Abweichungen bei der Effizienz geben kann, sind nur Kombinationen förderfähig, bei denen die Effizienz-Klasse „A+++\" oder „A++\" der mittleren Klimazone nachgewiesen wird. Diese Effizienz-Klasse ist im Energielabel gemäß Verordnung (EU) 626/2011 zu finden.\n• Multi-Split-Geräte\nDie Listung förderfähiger Wärmepumpen im Wärmeerzeugerportal des BAFA enthält Multi-Split-Außengeräte, die zertifiziert und förderfähig sind. Da es mit der Kombination von Innengeräten aber Abweichungen bei der Effizienz geben kann, sind nur Kombinationen förderfähig, bei denen die Effizienz-Klasse „A+++\" oder „A++\" der mittleren Klimazone nachgewiesen wird. Diese Effizienz-Klasse ist im Energielabel gemäß Verordnung (EU) 626/2011 zu finden. Falls vor der energetischen Sanierung bereits Innengeräte vorhanden waren und diese weiterhin verwendet werden, müssen auch diese in der Gesamt-Kombination im Energielabel ersichtlich sein.\n\nEffizienzanforderung an Außen-/Innengerät-Kombinationen mit einer Heizleistung von mehr als 12 kW\n• Single-Split- und Multi-Split-Geräte\nDie Listung förderfähiger Wärmepumpen im Wärmeerzeugerportal des BAFA enthält Außengeräte, die zertifiziert und förderfähig sind. Da es mit der Kombination von Innengeräten aber Abweichungen bei der Effizienz geben kann, sind nur Kombinationen förderfähig, zu denen als Nachweis ein Herstellerdatenblatt gemäß Verordnung (EU) 2281/2016 mit einem Raumheizungs-Jahresnutzungsgrad (ηs,h) von mindestens 150 % im Heizbetrieb erbracht werden kann.\n• VRF-Geräte\nDie Liste förderfähiger Wärmepumpen enthält zertifizierte und förderfähige Außengeräte. Alle Kombinationen dieser Außengeräte mit geeigneten Innengeräten sind förderfähig. Es wird kein weiter Nachweis durch Energielabel bzw. Herstellernachweis notwendig.\n\nSofern bei Luft-Luft-Wärmepumpen mit einer Heizleistung von ≤ 12 kW die ETAs-Werte geprüfter/zertifizierter Luft/Luft-Wärmepumpen nicht verfügbar sind, können diese anhand der nachfolgenden Gleichung gemäß Verordnung (EU) Nummer 2016/2281 über den vorhandenen SCOP-Wert umgerechnet werden:\n\nETAs = [SCOP × 1/CC − F(1)] × 100\n\nDabei ist:\n• ETAs: jahreszeitbedingte Raumheizungs-Energieeffizienz (ηs) gemäß Verordnung (EU) Nummer 813/2013 [in %]\n• SCOP: saisonale Arbeitszahl im Heizbetrieb gemäß DIN EN 14825 [in kWh/kWh]\n• CC: Umwandlungskoeffizient in Höhe von 2,5 gemäß Verordnung (EU) Nummer 813/2013 zur Berücksichtigung des durchschnittlichen Wirkungsgrads der Stromerzeugung in der EU\n• F(1): Korrekturwert in Höhe von 0,03 gemäß Mitteilung 2014/C 207/02 der EU-Kommission zur Berücksichtigung des Hilfsstromverbrauchs von Temperaturreglern"}, {"nr": "8.22", "thema": "Wärmepumpen - Wärmepumpen in Sonderbauform, Effizienzbewertung", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Sofern Bauformen von Wärmepumpen nicht oder nur teilweise über die Verordnungen der Ökodesign-Richtlinie abgebildet werden, sind deren ETAs-Werte auf Basis geprüfter oder berechneter Daten anhand der Berechnungsmethodik der DIN EN 14825 zu bestimmen. Fehlende Werte dürfen durch Interpolation und/oder Extrapolation bestimmt werden."}, {"nr": "8.23", "thema": "Wärmepumpen - Netzdienliche Schnittstelle, SG Ready, VHP Ready, Smart-Meter-Gateway (SMGW)", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Förderfähige Wärmepumpen müssen gemäß der BNetzA Festlegung zu § 14a Energiewirtschaftsgesetz (EnWG) über Schnittstellen verfügen, über die sie automatisiert netzdienlich aktiviert und betrieben werden können (zum Beispiel anhand der Standards „SG Ready\" (Smart Grid Ready) oder „VHP Ready\" (Virtual Heat and Power Ready) oder VDE-AR-E 2829-6 / DIN EN 50631 (EEBUS)), um an ein zertifiziertes Smart-Meter-Gateway angeschlossen werden zu können, damit energiewirtschaftlich relevante Mess- und Steuerungsvorgänge entsprechend den Anforderungen des Energiewirtschaftsgesetzes und des Messstellenbetriebsgesetzes abgewickelt werden können.\n\nDie netzdienliche Steuerbarkeit gilt ohne weiteren Nachweis für förderfähige Wärmepumpen als erfüllt, sofern begünstigte Wärmepumpen mindestens:\n• über eine offene (nicht-proprietäre), als Stand der Technik veröffentlichte und geeignete digitale Kommunikationsschnittstelle, die Signale aus dem Stromsystem empfangen und verarbeiten kann, um netzdienlich gesteuert und betrieben werden zu können, bspw. gemäß VDE-AR-E 2829-6 / EN 50631 (EEBUS) verfügen oder\n• die Anforderungen der Schnittstellen der Steuerungseinrichtung zum Anschluss und zur Übermittlung des Steuerbefehls erfüllen, welche gemäß Tenorziffer 2 des Beschluss BK6-22-300 der BNetzA zu § 14a Energiewirtschaftsgesetz (EnWG) bis Sept. 2024 durch die Netzbetreiber der Bundesnetzagentur vorgelegt und durch die Bundesnetzagentur veröffentlicht oder festgelegt werden,\n• die unter Punkt 2.1 des aktuellen SG Ready Regulariums (V 2.0) festgelegten Anforderungen umsetzen können oder\nnur für Luft-Luft-Wärmepumpen:\n• die im aktuellen FGK Status-Report 60 festgelegten Anforderungen für Luft-Luft-Wärmepumpen erfüllen."}, {"nr": "8.24", "thema": "Wärmepumpen - Beratung zum Einsatz zukunftssicherer Kältemittel", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Beratung zum Einsatz von Wärmepumpen umfasst den Einsatz zukunftssicherer und natürlicher Kältemittel. Die Zukunftssicherheit steht u. a. im Zusammenhang mit der Umweltrelevanz von Kältemitteln und deren Treibhauspotenzial (GWP - Global warming potential).\n\nAls Grundlage für die Beratung eignen sich die Themenseite „Kältemittel\" des Umweltbundesamtes: https://www.umweltbundesamt.de/themen/klima-energie/fluorierte-treibhausgase-fckw/natuerliche-kaeltemittel-in-stationaeren-anlagen/kaeltemittel. Die Beratung erfolgt zur Information des Förderempfängers. Die Umsetzung verantwortet der Förderempfänger.\n\nAb 1. Januar 2028 werden nur noch Wärmepumpen mit natürlichen Kältemitteln gefördert (siehe hierzu TMA 3.4.4 der BEG EM)."}, {"nr": "8.25", "thema": "Kraft-Wärme-Kopplung, Brennstoffzellenheizung", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Brennstoffzellenheizungen müssen zu 100 % mit grünem oder blauem Wasserstoff bzw. Biomethan betrieben werden. KWK-Anlagen müssen die technischen Mindestanforderungen für Biomasseheizungen erfüllen und sind ausschließlich mit Biomasse zu betreiben.\n\nEine Brennstoffzelle ist in die Wärme- und Stromversorgung des Gebäudes einzubinden.\n\nEine Kumulierung (gleichzeitige Inanspruchnahme) der BEG-Förderung und der Förderung nach dem Erneuerbare-Energien-Gesetz (EEG) ist nicht möglich.\n\nBei Errichtung sowie Nachrüstung von Brennstoffzellenheizungen oder KWK-Anlagen müssen die durch die Anlagen versorgten Wohneinheiten oder Flächen bzw. versorgten Gebäudeteile nach Durchführung der Maßnahme zu mindestens 65 % durch erneuerbare Energien und /oder unvermeidbare Abwärme beheizt werden. Die Bilanzierung des EE-Anteils kann nach DIN V 18599 erfolgen. Maßgeblich für den EE-Anteil von 65 % ist dabei die über die Dauer einer Heizperiode benötigte Energiemenge und nicht die Leistung der Anlage. Dabei sind die durch bestehende und neu installierte Wärmeerzeuger bereitgestellten Wärmemengen (erneuerbare und nicht erneuerbare Energien) zu berücksichtigen.\n\nDie Einhaltung der 65-Prozent-Pflicht wird grundsätzlich als erfüllt angesehen, wenn bei vorrangig bivalent-parallelem oder bivalent teilparallelem Betrieb die Leistung der Brennstoffzellenanlage mindestens 30 % der Norm-Heizlast des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt und bei bivalent alternativem Betrieb die Leistung der Brennstoffzellenanlage mindestens 40 % der gesamten Heizleistung aller Wärmeerzeuger oder mindestens 40 % der Norm-Heizlast des Gebäudes bzw. des zu versorgenden Gebäudeteils beträgt."}, {"nr": "8.26", "thema": "Wasserstofffähige Heizung", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Wasserstofffähige Heizungen im Sinne der BEG EM sind Gas-Brennwertheizungen, die bei Inbetriebnahme direkt mit 100 % grünem oder blauem Wasserstoff betrieben werden oder die die Anforderungen nach § 71k GEG erfüllen und durch Umrüstsets oder Nachrüstsätze auf einen Betrieb mit 100 % Wasserstoff umgestellt werden können. § 71k GEG fordert, dass sich das Gebäude nachweislich in einem Wasserstoffnetzausbaugebiet befindet und ein Fahrplan für die vollständige Versorgung mit Wasserstoff durch den Betreiber des Verteilnetzes vorliegt.\n\nVoraussetzung ist die Einhaltung der Effizienzanforderungen gemäß der Anlage „Technische Mindestanforderungen\" (TMA) Nummer 3.6.1 zur Richtlinie BEG EM sowie der Nachweis der Einhaltung von mindestens 65 % EE-Anteil für den zu sanierenden Versorgungsbereich (siehe TFAQ 8.08 „65 %-EE-Anteil, allgemein\").\n\nHinweis:\nGas-Brennwertkessel mit einem „H2-ready\" Label können üblicherweise mit bis zu 20 % Wasserstoff Beimischung betrieben werden. Für die Einhaltung der technischen Mindestanforderungen müssen diese Geräte auf einen Betrieb mit 100 % Wasserstoff umrüstbar sein und die Anforderungen des § 71k GEG müssen erfüllt werden."}, {"nr": "8.27", "thema": "Innovative Heizungstechnik auf Basis erneuerbaren Energien", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Als innovative Heiztechnik i. S. v. 5.3 f) wird eine effiziente Heizungsanlage gefördert, die mit erneuerbaren Energien eine Heizleistung von mindestens 80 % der Gebäudeheizlast sowie 80 % ihrer Nennleistung erreicht und deren spezifische Treibhausgas-Emissionen einen Wert von 50 g pro Kilowattstunde Erzeugernutzwärmeabgabe entsprechend geltender DIN V 18599-1 nicht überschreitet.\n\nDer spezifische Emissionsfaktor ist durch ein unabhängiges Institut auf Basis eines Betriebs in einer typischen Anwendung zu bestätigen. Dabei ist die Vorkette des Energieträgers mit einem anerkannten Ökobilanzinstrument (GEMIS, ÖKOBAUDAT, etc.) zu berücksichtigen. Bei gleichzeitiger Erzeugung von Strom und Wärme erfolgt eine Allokation nach Carnotmethode. In der Bilanzierung sind die Emissionsfaktoren gemäß GEG Anlage 9 „Umrechnung in Treibhausgasemissionen\" zu verwenden.\n\nFolgende Wärmeerzeuger und Technologien sind keine innovative Heiztechnik im Sinne der BEG EM. Sie sind nach Nummer. 5.3 Buchstabe f BEG EM lediglich dann förderfähig, wenn sie als Bestandteil einer Heizungsanlage eingesetzt werden, die o. g. Anforderungen erfüllt:\n• Wärmeerzeuger, die den Ziffern 3.2 bis 3.6 der TMA entsprechen und gemäß BEG EM förderfähig sind,\n• Wärmeerzeuger und Technologien, die gemäß Richtlinie und TMA von der Förderung ausgeschlossen sind und\n• Technologien, die bereits am Markt etabliert sind (wie z. B. Heizungsanlagen, die auf Photovoltaik in Verbindung mit Stromdirektheizung basieren).\n\nDie Durchführer veröffentlichen eine Positivliste, in der neue innovative Anlagenkonzepte, als förderfähige innovative Heiztechniken i. S. v. Nummer 5.3 Buchstabe f BEG EM aufgenommen werden können. Die Einhaltung der o. g. Anforderungen ist vorher durch ein vom Anlagenhersteller beauftragtes unabhängiges wissenschaftliches Gutachten zu überprüfen und den Durchführern zur Prüfung zu übergeben. Bitte senden Sie Ihren formlosen Antrag auf Aufnahme in die Positivliste und das Gutachten in elektronischer Form an Technik-EE@bafa.bund.de.\n\nEine begründete Entscheidung über die Aufnahme in die Positivliste erfolgt, nachdem Rückfragen der Durchführer zum detaillierten Anlagenkonzept und dem Gutachten durch den Antragsteller beantwortet sind."}, {"nr": "8.28", "thema": "Errichtung, Umbau, Erweiterung eines Gebäudenetzes, Bilanzierung EE-Anteile/unvermeidbare Abwärme", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Die Errichtung, der Umbau oder die Erweiterung eines Gebäudenetzes ist förderfähig, sofern die Wärme- oder Kälteerzeugung, mit der das Gebäudenetz gespeist wird, nach Durchführung der Maßnahme zu mindestens 65 % durch erneuerbare Energien (EE-Anteil) und/oder durch unvermeidbare Abwärme erfolgt.\n\n(siehe auch TFAQ 8.32 „Gebäudenetz, unvermeidbare Abwärme\", TFAQ 8.31 „Gebäudenetz, Anzahl Gebäude und Wohneinheiten\", TFAQ 8.33 „Gebäudenetz, technische Mindestanforderungen an die Wärmeerzeuger\")\n\nBilanzierung und Nachweis des Anteils erneuerbarer Energien und/oder unvermeidbare Abwärme in Gebäudenetzen erfolgt über einen rechnerischen Einzelnachweis nach DIN V 18599 oder in Anlehnung an das AGFW-Arbeitsblatt FW 309 Teil 5 zusammen mit der dazugehörigen Musterbescheinigung nach FW 309 Teil 7."}, {"nr": "8.29", "thema": "Anschluss an ein Gebäudenetz, Bilanzierung EE-Anteile / unvermeidbare Abwärme", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Der Anschluss an ein Gebäudenetz beziehungsweise die Erneuerung eines Netzanschlusses ist förderfähig, sofern die Wärme- oder Kälteerzeugung, mit der das Gebäudenetz gespeist wird, zu mindestens 25 % durch erneuerbare Energien (EE-Anteil) und/oder durch unvermeidbare Abwärme erfolgt. Dazu gehören Wärmeübergabestationen, Verteilleitungen auf dem Grundstück, Steuer-, Mess- und Regelungstechnik, notwendige Einstellungen an vorhandenen Wärmeerzeugern einschließlich Heizungsoptimierung und hydraulischem Abgleich des Heizungssystems.\n\n(siehe auch TFAQ 8.32 „Gebäudenetz, unvermeidbare Abwärme\").\n\nDie Bilanzierung des Anteils erneuerbarer Energien (EE-Anteil) und/oder des Anteils unvermeidbarer Abwärme ist gemäß Nummer 3.9.2 der BEG EM TMA über einen rechnerischen Einzelnachweis nach DIN V 18599 oder in Anlehnung an das AGFW-Arbeitsblatt FW 309 Teil 5 zusammen mit der dazugehörigen Musterbescheinigung nach FW 309 Teil 7 durchzuführen.\n\nFür Wohngebäude mit wassergeführter Heizungsanlage und für Nichtwohngebäude mit hydraulisch betriebenen Wärme- und Kälteversorgungsanlagen ist gemäß der Anlage „Technische Mindestanforderungen\" (TMA) Nummern 3.1 zur Förderrichtlinie bei Erneuerung der Anlagentechnik die Durchführung eines hydraulischen Abgleichs stets erforderlich. Dies gilt auch bei Anschluss beziehungsweise Erneuerung eines Gebäudenetzanschlusses. (siehe auch TFAQ 8.03 „Hydraulischer Abgleich\")"}, {"nr": "8.30", "thema": "Anschluss an ein Wärmenetz", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Der Anschluss an ein Wärmenetz beziehungsweise die Erneuerung eines Netzanschlusses ist in der BEG EM förderfähig. Dabei bestehen keine Anforderungen an den Anteil erneuerbarer Energien zur Wärmeerzeugung im Wärmenetz.\n\nEin Wärmenetzanschluss umfasst Wärmeübergabestationen, Verteilleitungen auf dem Grundstück, Mess-, Steuerungs- und Regelungstechnik, notwendige Einstellungen an bestehenden Wärmeerzeugern einschließlich Heizungsoptimierung und hydraulischem Abgleich des Heizungssystems.\n\nDer Anschluss mehrerer Gebäude an ein Wärmenetz einschließlich des internen Verteilnetzes kann ebenfalls als Anschluss an ein Wärmenetz gefördert werden, wenn ein gemeinsamer Anschluss an das Wärmenetz vorhanden oder mit der beantragten Maßnahme umgesetzt wird. Das interne Verteilnetz gilt in diesem Fall nicht als Gebäudenetz.\n\nFür Wohngebäude mit wassergeführter Heizungsanlage und für Nichtwohngebäude mit hydraulisch betriebenen Wärme- und Kälteversorgungsanlagen ist gemäß der Anlage „Technische Mindestanforderungen\" (TMA) Nummern 3.1 zur Förderrichtlinie bei Erneuerung der Anlagentechnik die Durchführung eines hydraulischen Abgleichs stets erforderlich. Dies gilt auch bei Anschluss beziehungsweise Erneuerung eines Wärmenetzanschlusses. (siehe auch TFAQ 8.03 „Hydraulischer Abgleich\")"}, {"nr": "8.31", "thema": "Gebäudenetz, Anzahl Gebäude und Wohneinheiten", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Nach den Begriffsbestimmungen der BEG und des GEG ist ein „Gebäudenetz\" ein nicht öffentliches Netz zur Versorgung mit ausschließlich Wärme und/oder Kälte von bis zu 16 Gebäuden (Wohngebäude oder Nichtwohngebäude) und bis zu 100 Wohneinheiten.\n\nFür ein Gebäudenetz müssen beide Bedingungen gleichzeitig eingehalten werden. Das heißt, dass zwei bis maximal 16 Gebäude mit null bis maximal 100 Wohneinheiten ein Gebäudenetz bilden können.\n\nEine Förderung als Gebäudenetz ist somit nicht möglich\n• ab 17 Gebäuden, auch wenn die Anzahl der mit Wärme versorgten Wohneinheiten kleiner oder gleich 100 ist.\n• bei mehr als 100 Wohneinheiten, auch wenn die Anzahl der mit Wärme versorgten Gebäude kleiner oder gleich 16 ist.\n\nDie Abgrenzung zwischen Gebäuden und Gebäudeteilen erfolgt nach TFAQ 1.11 „Abgrenzung Gebäude / Gebäudeteile (insbesondere bei Gebäudenetzen)\".\n\nDie unterschiedlich genutzten Gebäudeteile eines gemischt genutzten Gebäudes zählen in einem Gebäudenetz auch dann als ein (gemeinsames) Gebäude, wenn diese nach § 106 GEG getrennt zu betrachten sind (siehe TFAQ 1.01 „Gemischt genutzte Gebäude\").\n\nHinweis: Bei der Bewertung, ob ein „Gebäudenetz\" vorliegt, ist es im Weiteren unerheblich, ob parallel zum Gebäudenetz (also in derselben Leitungsführung) weitere Netze (z. B. Stromnetz, Fernmeldeleitungen) verlegt sind."}, {"nr": "8.32", "thema": "Gebäudenetz, unvermeidbare Abwärme", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Unvermeidbare Abwärme kann in Gebäudenetzen anteilig angerechnet werden, wenn es sich um unvermeidbare Abwärme im Sinne der Förderrichtlinie handelt und soweit diese über ein technisches System, wie etwa über eine Wärmepumpe oder über einen Wärmeübertrager, nutzbar gemacht und im Gebäudenetz zur Deckung des Wärmebedarfs eingesetzt wird.\n\nDie Wärme aus KWK-Anlagen ist keine unvermeidbare Abwärme im Sinne der BEG.\n\nDie thermische Behandlung von Abfall ist keine unvermeidbare Abwärme im Sinne der BEG. Dies gilt auch dann, wenn der Nachweis dieses Anteils in Anlehnung an das AGFW-Arbeitsblatt FW 309 Teil 5 zusammen mit der dazugehörigen Musterbescheinigung nach FW 309 Teil 7 erfolgt.\n\nGrundsätzlich dürfen der Anteil erneuerbarer Energien und der Abwärmeanteil für den Nachweis der jeweiligen Mindestanforderung in einem Gebäudenetz addiert werden. Hat ein Energieträger sowohl die Eigenschaft „erneuerbare Energie\" als auch „Abwärme\", kann nur eine der beiden Eigenschaften als Anteil an der Wärmeerzeugung berücksichtigt werden.\n\nAbwärme aus industriellen, landwirtschaftlichen oder gewerblichen Prozessen oder aus IT-Technik, die direkt in den Aufstellraum der Maschinen oder Geräte abgegeben wird, kann nicht als unvermeidbare Abwärme angerechnet werden. Es kann nur solche Abwärme angerechnet werden, die über ein technisches System nutzbar gemacht wird.\n\nAbwärme aus Kälteerzeugungsanlagen kann nur zu dem Anteil als unvermeidbare Abwärme angerechnet werden, zu dem die erzeugte Kälte für Produktionsprozesse verwendet wird. Wird ein Teil der erzeugten Kälte für gebäudebezogene Kühlung (z. B. Klimatisierung von Räumen im Sommer) verwendet, kann dieser Anteil der Abwärme nicht als unvermeidbare Abwärme angerechnet werden.\n\nAbwärme aus prozessbezogener Abluft (z. B. Küchenabluft) kann anteilig als Abwärme angerechnet werden, wenn diese über ein technisches System nutzbar gemacht wird.\n\nNicht prozessbezogene Wärme aus Abluft (bzw. Raumluft, Fortluft) kann ausschließlich dann als Wärmequelle für erneuerbare Energien angerechnet werden, wenn sie über eine Wärmepumpe nutzbar gemacht wird."}, {"nr": "8.33", "thema": "Gebäudenetz, technische Mindestanforderungen an die Wärmeerzeuger", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Neue Wärmeerzeuger, die bei der Errichtung, dem Umbau oder der Erweiterung eines Gebäudenetzes eingesetzt werden, müssen neben den jeweiligen Anforderungen gemäß der Anlage „Technische Mindestanforderungen\" (TMA) Nummern 3.2 bis 3.7 der BEG EM Förderrichtlinie und/oder der Einbindung unvermeidbarer Abwärme zusätzlich auch die übergreifenden Technischen Mindestanforderungen nach Nummer 3.1 der TMA einhalten. Andere bzw. weitere als die in der BEG EM benannten neuen Wärmeerzeuger dürfen eingesetzt werden, sind aber nicht förderfähig.\n\nBei Umbau oder Erweiterung bestehender Gebäudenetze dürfen auch andere und von den oben benannten abweichende Wärmeerzeuger im Gebäudenetz vorhanden sein und weiter betrieben werden.\n\nHinweis: Gebäudenetze mit Biomasseheizungen, für die der Klimageschwindigkeits-Bonus gewährt wird, müssen mit einer solarthermischen Anlage, einer Anlage zur Erzeugung von Strom aus solarer Strahlungsenergie zur elektrischen Warmwasserbereitung oder Wärmepumpe zur Warmwasserbereitung und/oder Raumheizungsunterstützung kombiniert sein.\n\nDiese Anlagen sind mindestens so zu dimensionieren, dass sie die Trinkwassererwärmung der versorgten Gebäude bilanziell vollständig decken könnten. Die Bilanzierung orientiert sich an den Standardwerten der DIN V 18599.\n\nDie Anforderung gilt ebenso als erfüllt, wenn solarthermischen Anlagen und/oder Wärmepumpen und/oder unvermeidbare Abwärme einem Anteil von mindestens 25 Prozent an der Wärmeerzeugung haben.\n\nDer Nachweis über den geforderten Mindestanteil (siehe TFAQ 8.09 „65 %-EE-Anteil, Nachweis über Erfüllungsoptionen\") erfolgt über einen rechnerischen Einzelnachweis nach DIN V 18599 oder in Anlehnung an das AGFW-Arbeitsblatt FW 309 Teil 5 zusammen mit der dazugehörigen Musterbescheinigung nach FW 309 Teil 7.\n\n(siehe auch TFAQ 1.11 „Abgrenzung Gebäude / Gebäudeteile (insbesondere bei Gebäudenetzen)\")"}, {"nr": "8.34", "thema": "Pufferspeicher", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Bei Ersatz, Erweiterung oder erstmaligem Einbau eines Pufferspeichers bis zu einer Größe von 1.000 l im Rahmen einer Maßnahme zur Heizungsoptimierung sind die Effizienzklassen A oder A+ gemäß Verordnung (EU) Nummer 812/2013 einzuhalten.\n\nWird ein Pufferspeicher bei Maßnahmen nach Richtlinie BEG EM Ziffer 5.3 für Biomasseheizungen zur Einhaltung der Technischen Mindestanforderungen installiert oder als Umfeldmaßnahme bei anderen Heizungsanlagen nach Richtlinie BEG EM Ziffer 5.3 mit gefördert, gelten die oben genannten Effizienzanforderungen nicht."}, {"nr": "8.35", "thema": "Heizungsoptimierung, Maßnahmen zur Emissionsminderung, Nachweis der Reduzierung der Staubemissionen", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Der Nachweis der Reduzierung der Staubemissionen ist über einen der folgenden Wege möglich:\n• Messung vor Ort: durch einen Schornsteinfeger nach den gemäß 1. BImSchV anerkannten Methoden\no im Betrieb mit und ohne Staubminderungsmaßnahme, oder\no vor und nach der Installation.\nZum Nachweis der Staubemissionen vor Installation kann das Messprotokoll der letzten Routineüberprüfung herangezogen werden.\n• Prüfzertifikat: von einer unabhängigen Prüfstelle in Anlehnung an die DIN SPEC 33999 gemessene Wert des Mindestabscheidegrades eines Partikelfilters von mindestens 80 %,\n• Listung: die Anforderungen gelten als erfüllt, wenn der installierte Partikelfilter in Kombination mit der vorhandenen Biomasseanlage im Wärmeerzeugerportal verzeichnet ist und der Staubemissionsgrenzwert von max. 2,5 mg/m³ eingehalten wird."}, {"nr": "8.36", "thema": "Grüner oder blauer Wasserstoff", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Grüner Wasserstoff nach § 3 Absatz 1 Nr. 13b GEG, ist Wasserstoff, der mittels Elektrolyse aus Wasser gewonnen wird und bei dessen Herstellung ausschließlich Strom aus erneuerbaren Energien entsprechend der Vorgaben des delegierten Rechtsaktes nach Artikel 27 und 28 der Richtlinie 2018/2001 (RED II) verwendet wird.\n\nBlauer Wasserstoff nach § 3 Absatz 1 Nr. 4a GEG ist Wasserstoff, der durch Reformation oder Pyrolyse aus Erdgas hergestellt wird und der alle weiteren der dort beschriebenen Anforderungen erfüllt."}, {"nr": "8.37", "thema": "Nachweis grüner oder blauer Wasserstoff bzw. Biomethan", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Als Nachweis über die Nutzung von Biomethan (gasförmige Biomasse) oder von nicht selbsterzeugtem grünem oder blauem Wasserstoff gelten die Abrechnungen des Biomethan- oder Wasserstofflieferanten oder ein Liefervertrag über mindestens 10 Jahre Laufzeit. Für den Nachweis über Abrechnungen sind diese jeweils über mindestens 5 Jahre ab dem Zeitpunkt der Lieferung aufzubewahren. Eigentümer oder Belieferte müssen gemäß Aufbewahrungspflichten des § 96 Absatz 5 GEG für den öffentlich-rechtlichen Nachweis mindestens 15 Jahre nach Inbetriebnahme der Heizung so verfahren.\n\nVoraussetzung und Bestandteil des Nachweises ist die Bestätigung des Lieferanten über die Erfüllung der betreffenden Anforderungen des § 96 Absätze 4 und 6 GEG. Danach müssen bei Nutzung von Biomethan die Anforderungen an die Qualität und die Massenbilanz nach § 22 Absatz 1 Satz 1 Nummer 2 Buchstabe c und d GEG vom Lieferanten erfüllt werden. Zudem müssen bei Nutzung von Biomethan bzw. grünem oder blauem Wasserstoff die jeweiligen Anforderungen nach § 71f Absatz 2 bis 4 vom Lieferanten erfüllt werden.\n\nFür selbsterzeugten grünen oder blauen Wasserstoff bestehen die oben genannten Nachweispflichten nicht."}, {"nr": "8.38", "thema": "Schallschutz von Wärmepumpen durch Schallschutzhauben/-matten", "relevanz": "WG, NWG", "section": "Anlagen zur Wärmeerzeugung (Heizungstechnik)", "beschreibung": "Zur Einhaltung der Geräuschemissionsgrenzwerte des Außengeräts von Luft-Wasser-Wärmepumpen können Schallschutzhauben oder -matten genutzt werden, sofern die Geräte einschließlich der Schallschutzhauben oder -matten unabhängig geprüft, zertifiziert und im Wärmeerzeugerportal gelistet sind."}]};

let currentAudio = null;
function stopSpeaking(){
  if(currentAudio){ try{ currentAudio.pause(); currentAudio.currentTime=0; }catch(_){} currentAudio=null; }
}
function playClip(dataUri, onstart, onend){
  stopSpeaking();
  if(!dataUri){ if(onend) onend(); return false; }   // no clip embedded → silent
  try{
    const a = new Audio(dataUri);
    currentAudio = a;
    if(onstart) a.onplay = onstart;
    a.onended = a.onerror = ()=>{ currentAudio=null; if(onend) onend(); };
    a.play().catch(()=>{ currentAudio=null; if(onend) onend(); });
    return true;
  }catch(_){ currentAudio=null; if(onend) onend(); return false; }
}
const hasGreeting = AUDIO_GREETING && AUDIO_GREETING.indexOf("__AUDIO_")!==0;
const hasIntro    = AUDIO_INTRO    && AUDIO_INTRO.indexOf("__AUDIO_")!==0;

// ---- helpers (search logic unchanged from the verbatim tool) ----
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){
  return s.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9.%§]/g,' ').replace(/\s+/g,' ').trim();
}
ENTRIES.forEach(e=>{
  e._blob = norm(e.nr + " " + e.thema + " " + e.beschreibung + " " + e.section + " " + e.relevanz);
  e._themaN = norm(e.thema);
});
function tokenize(query){
  return norm(query).split(' ').filter(t=>t.length>=2 || /^\d/.test(t));
}
function scoreEntry(e, tokens, rawQuery){
  let score=0;
  const qTrim = rawQuery.trim();
  if(e.nr === qTrim){score+=1000;}
  if(e.nr.startsWith(qTrim) && /^\d/.test(qTrim)){score+=200;}
  for(const t of tokens){
    if(!e._blob.includes(t)) return -1;
    if(e._themaN.includes(t)) score+=12;
    if(norm(e.nr).includes(t)) score+=8;
    let idx=0,c=0; while((idx=e._blob.indexOf(t,idx))!==-1 && c<6){c++;idx+=t.length;}
    score+=c;
  }
  return score;
}
function relOk(e){
  if(relFilter==="ALL") return true;
  const r=(e.relevanz||"").toUpperCase();
  if(relFilter==="WG") return r.includes("WG");
  if(relFilter==="NWG") return r.includes("NWG");
  return true;
}
function highlight(text, tokens){
  let html = esc(text);
  html = html.replace(/TFAQ\s+(\d\.\d{2})/g,
    (m,nr)=>'<span class="xref" data-go="'+nr+'">'+m+'</span>');
  const uniq=[...new Set(tokens)].filter(t=>t.length>=3);
  for(const t of uniq){
    try{
      const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      html = html.split(/(<[^>]+>)/).map(chunk=>{
        if(chunk.startsWith('<')) return chunk;
        return chunk.replace(re,'<mark>$1</mark>');
      }).join('');
    }catch(_){}
  }
  return html;
}
function relTags(rel){
  if(!rel) return '';
  const parts=rel.split(',').map(s=>s.trim()).filter(Boolean);
  return '<span class="tags">'+parts.map(p=>{
    const cls = p.toUpperCase()==='WG'?'wg':'nwg';
    return '<span class="tag '+cls+'">'+esc(p)+'</span>';
  }).join('')+'</span>';
}

      relTags(e.relevanz)+
    '</div>'+
    '<div class="section">'+esc(e.section)+'</div>'+
    '<div class="body">'+highlight(e.beschreibung, tokens||[])+'</div>'+
  '</div>';
}

const results=document.getElementById('results');
const countEl=document.getElementById('count');
const bubble=document.getElementById('bubble');
const panda=document.getElementById('panda');

// The panda SPEAKS only framing text, never the answer content.
function say(html){ bubble.innerHTML = html; }
function pandaThink(){ panda.classList.remove('think'); void panda.offsetWidth; panda.classList.add('think'); }

// Reusable speak button. It plays a pre-rendered MP3 clip (Bruno's voice).
function speakBtnHTML(label, available){
  return available ? '<button class="speakbtn" id="bubblespeak" type="button">🔊 '+label+'</button>' : '';
}
function wireBubbleSpeak(getClip, label){
  const btn = document.getElementById('bubblespeak');
  if(!btn) return;
  btn.addEventListener('click',()=>{
    if(btn.classList.contains('speaking')){
      stopSpeaking(); btn.classList.remove('speaking'); btn.textContent='🔊 '+label; return;
    }
    btn.classList.add('speaking'); btn.textContent='⏹ Stopp'; pandaThink();
    playClip(getClip(), null,
      ()=>{ btn.classList.remove('speaking'); btn.textContent='🔊 '+label; });
  });
}

function run(withVoice){
  const raw=document.getElementById('q').value;
  const tokens=tokenize(raw);

  if(tokens.length===0){
    let list = ENTRIES.filter(relOk);
    if(relFilter==="ALL"){
      say('<span class="lead">Hallo, ich bin Bruno der Panda! 🐼</span><br><span class="small">Frag mich nach einem '+
          'Stichwort oder einer TFAQ-Nummer – ich suche dir den passenden Original-Eintrag heraus. '+
          'Ich gebe dir immer den <strong>unveränderten Text</strong>, nie eine eigene Antwort.</span><br>'+
          speakBtnHTML('Bruno anhören', hasGreeting));
      wireBubbleSpeak(()=>AUDIO_GREETING, 'Bruno anhören');
      countEl.textContent=''; results.innerHTML=''; return;
    }
    say('<span class="lead">Filter: '+relFilter+' 🐼</span><br><span class="small">'+
        list.length+' Einträge mit dieser Relevanz. Tippe ein Stichwort, um zu suchen.</span>');
    countEl.textContent = list.length+' Einträge ('+relFilter+')';
    results.innerHTML = list.map(e=>renderEntry(e,[])).join(''); bindXrefs(); return;
  }

  const scored = ENTRIES.map(e=>({e,s:scoreEntry(e,tokens,raw)}))
                        .filter(o=>o.s>=0 && relOk(o.e))
                        .sort((a,b)=>b.s-a.s);
  countEl.textContent = scored.length+' Treffer';

  if(scored.length===0){
    say('<span class="lead">Hmm … 🐼</span><br><span class="small">Dazu habe ich leider '+
        '<strong>keinen passenden TFAQ-Eintrag</strong> gefunden. Versuch ein anderes Stichwort '+
        'oder eine TFAQ-Nummer (z. B. 8.03).</span>');
    results.innerHTML=''; return;
  }

  pandaThink();
  const top = scored[0].e;
  if(scored.length===1){
    say('<span class="lead">Ich habe <strong>TFAQ '+esc(top.nr)+'</strong> für dich gefunden:</span><br>'+
        '<span class="small">'+esc(top.thema)+' – hier der Originaltext unten.</span>'+
        (hasIntro ? '<br>'+speakBtnHTML('Bruno hören', true) : ''));
  }else{
    say('<span class="lead">Ich habe <strong>'+scored.length+' Einträge</strong> gefunden.</span><br>'+
        '<span class="small">Der beste Treffer ist <strong>TFAQ '+esc(top.nr)+'</strong> ('+esc(top.thema)+'). '+
        'Alle Treffer stehen unten – jeweils im Originaltext.</span>'+
        (hasIntro ? '<br>'+speakBtnHTML('Bruno hören', true) : ''));
  }
  if(hasIntro){
    wireBubbleSpeak(()=>AUDIO_INTRO, 'Bruno hören');
    // Bruno speaks his intro line only when the search is "committed"
    // (Enter pressed or a short typing pause) — never on every keystroke.
    if(withVoice){
      playClip(AUDIO_INTRO, ()=>{
        const b=document.getElementById('bubblespeak'); if(b){b.classList.add('speaking');b.textContent='⏹ Stopp';}
      }, ()=>{
        const b=document.getElementById('bubblespeak'); if(b){b.classList.remove('speaking');b.textContent='🔊 Bruno hören';}
      });
    }
  }
  results.innerHTML = scored.map(o=>renderEntry(o.e,tokens)).join(''); bindXrefs();
}

function bindXrefs(){
  results.querySelectorAll('.xref').forEach(x=>{
    x.addEventListener('click',()=>goTo(x.getAttribute('data-go')));
  });
}
function goTo(nr){
  document.getElementById('q').value=nr;
  relFilter="ALL";
  document.querySelectorAll('#relfilter button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.rel==='ALL'?'true':'false'));
  stopSpeaking(); if(typeof clearVoiceTimer==='function') clearVoiceTimer();
  run(false);
  requestAnimationFrame(()=>{
    const el=document.getElementById('e-'+nr);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});
           el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
  });
}

// ---- events ----
const qEl=document.getElementById('q');
const clearBtn=document.getElementById('clear');

// If no audio clips are embedded yet, show a gentle note (Bruno stays silent).
if(!hasGreeting && !hasIntro){
  const nv=document.getElementById('novoice'); if(nv) nv.style.display='block';
}
// Typing shows results live but SILENT. Bruno only speaks when the search is
// "committed": Enter pressed, or a short pause (~900ms) after the last keystroke.
let voiceTimer = null;
function clearVoiceTimer(){ if(voiceTimer){ clearTimeout(voiceTimer); voiceTimer=null; } }

qEl.addEventListener('input',()=>{
  clearBtn.style.display=qEl.value?'block':'none';
  stopSpeaking();
  clearVoiceTimer();
  run(false);                                  // live results, no voice
  voiceTimer = setTimeout(()=>{ run(true); }, 900);  // speak after a typing pause
});
qEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); clearVoiceTimer(); stopSpeaking(); run(true); }
});
clearBtn.addEventListener('click',()=>{qEl.value='';clearBtn.style.display='none';stopSpeaking();clearVoiceTimer();qEl.focus();run(false);});
document.getElementById('relfilter').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b)return;
  relFilter=b.dataset.rel;
  document.querySelectorAll('#relfilter button').forEach(x=>
    x.setAttribute('aria-pressed', x===b?'true':'false'));
  clearVoiceTimer(); stopSpeaking();
  run(false);
});
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==='Escape'){qEl.value='';clearBtn.style.display='none';stopSpeaking();clearVoiceTimer();run(false);}
});

qEl.focus();
run(false);
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {/* offline / file:// — ignore */});
  });
}
</script>
